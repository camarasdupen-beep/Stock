<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Stock & Pedidos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9b9b97;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.20);
  --blue:#185FA5;--green:#3B6D11;
  --green-bg:#EAF3DE;--green-text:#27500A;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red-bg:#FCEBEB;--red-text:#A32D2D;
  --r:10px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#f0efe9;--text2:#9b9b97;--text3:#6b6b68;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --green-bg:#1a3308;--green-text:#97C459;
  --amber-bg:#2e1e04;--amber-text:#EF9F27;
  --red-bg:#2e0d0d;--red-text:#F09595;
}}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.page{display:none;flex-direction:column;flex:1;min-height:100dvh}.page.on{display:flex}
.tb{display:flex;align-items:center;padding:0 8px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);gap:4px;position:sticky;top:0;z-index:10}
.tb-t{font-size:16px;font-weight:600;flex:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:none;background:none;cursor:pointer;color:var(--text);font-size:22px;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.ib:active{background:var(--bg2)}
.bn{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:10px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;position:relative}
.nb i{font-size:20px}.nb.on{color:var(--blue)}
.cc{position:absolute;top:3px;right:2px;min-width:16px;height:16px;background:var(--blue);color:#fff;border-radius:99px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 14px}

/* PIN */
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 20px}
.pin-logo{width:64px;height:64px;background:var(--blue);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.pin-title{font-size:20px;font-weight:700;color:var(--text)}
.pin-dots{display:flex;gap:14px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:background .15s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue)}
.pin-error{font-size:13px;color:var(--red-text);height:18px;text-align:center}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.pin-btn{height:64px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);font-size:22px;font-weight:500;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .1s}
.pin-btn:active{background:var(--bg3)}
.pin-btn.del{font-size:18px;color:var(--text2)}
.pin-btn.empty{border:none;background:transparent;cursor:default}

/* badges */
.badge{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bok{background:var(--green-bg);color:var(--green-text)}
.blow{background:var(--amber-bg);color:var(--amber-text)}
.bcrit{background:var(--red-bg);color:var(--red-text)}
.bgrey{background:var(--bg2);color:var(--text2)}

/* cat rows */
.cr{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;gap:12px}
.cr:active{background:var(--bg2)}
.ci{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.cn{flex:1;min-width:0}
.cn-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn-sub{font-size:12px;color:var(--text2);margin-top:2px}
.cn-b{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* product rows */
.pr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.pm{flex:1;min-width:0}
.pname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psku{font-size:11px;color:var(--text3);margin-top:1px}
.pst{display:flex;align-items:center;gap:8px;margin-top:5px}
.snum{font-size:14px;font-weight:700}
.pb{width:48px;height:3px;background:var(--bg3);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbf{height:100%;border-radius:9px;display:block}
.qc{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qb{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;flex-shrink:0}
.qb:active{background:var(--bg3)}
.qb.add{background:var(--blue);color:#fff;border-color:var(--blue)}
.qnum{min-width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--text)}

/* ventas */
.rank-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);gap:12px}
.rank-pos{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0}
.rank-pos.top{background:var(--blue);color:#fff}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-cat{font-size:11px;color:var(--text3);margin-top:1px}
.rank-qty{font-size:14px;font-weight:700;color:var(--text);flex-shrink:0;text-align:right}
.rank-sub{font-size:11px;color:var(--text2);text-align:right}
.tab-row{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:52px;z-index:9}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

/* pedido */
.pc{margin-bottom:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg2);gap:8px}
.phn{font-size:14px;font-weight:600}
.prow{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--border);gap:10px}
.prn{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prq{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ptot{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;gap:6px;background:var(--bg2)}
.btns{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btns:active{opacity:.75}.bg{background:var(--green);color:#fff}

.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:13px;line-height:1.7}
.empty i{font-size:36px;display:block;margin:0 auto 12px;color:var(--text3)}
.ldg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--text2);font-size:13px;text-align:center}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ss{padding:6px 10px;border:1px solid var(--border2);border-radius:99px;font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none;max-width:130px}

/* valuación */
.val-hero{background:var(--blue);color:#fff;padding:22px 18px;margin:12px 14px;border-radius:14px}
.val-hero-label{font-size:12px;opacity:.8;margin-bottom:4px}
.val-hero-amount{font-size:32px;font-weight:700;letter-spacing:-.5px}
.val-hero-sub{font-size:12px;opacity:.75;margin-top:4px}
.val-cat-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.val-cat-name{flex:1;font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val-cat-right{text-align:right;flex-shrink:0}
.val-cat-amount{font-size:14px;font-weight:700;color:var(--text)}
.val-cat-sub{font-size:11px;color:var(--text2);margin-top:1px}
.val-section{padding:10px 16px 4px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}

.sep{padding:10px 16px 4px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border);margin-top:4px}
</style>
</head>
<body>
<div class="app">

<!-- PIN -->
<div class="page on" id="p-pin">
  <div class="pin-wrap">
    <div class="pin-logo"><i class="ti ti-building-store"></i></div>
    <div class="pin-title">Stock & Pedidos</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-error" id="pin-err"></div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="pinKey('1')">1</button>
      <button class="pin-btn" onclick="pinKey('2')">2</button>
      <button class="pin-btn" onclick="pinKey('3')">3</button>
      <button class="pin-btn" onclick="pinKey('4')">4</button>
      <button class="pin-btn" onclick="pinKey('5')">5</button>
      <button class="pin-btn" onclick="pinKey('6')">6</button>
      <button class="pin-btn" onclick="pinKey('7')">7</button>
      <button class="pin-btn" onclick="pinKey('8')">8</button>
      <button class="pin-btn" onclick="pinKey('9')">9</button>
      <div class="pin-btn empty"></div>
      <button class="pin-btn" onclick="pinKey('0')">0</button>
      <button class="pin-btn del" onclick="pinDel()"><i class="ti ti-backspace"></i></button>
    </div>
  </div>
</div>

<!-- PROVEEDORES -->
<div class="page" id="p-cats">
  <div class="tb">
    <span class="tb-t">Proveedores</span>
    <select class="ss" id="ss" onchange="onStore()"></select>
    <button class="ib" onclick="doReload()"><i class="ti ti-refresh"></i></button>
  </div>
  <div class="sc" id="cats-sc"></div>
  <div class="bn">
    <button class="nb on" id="nb-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb" id="nb-ventas" onclick="goPage('ventas')"><i class="ti ti-trending-up"></i>Ventas</button>
    <button class="nb" id="nb-val" onclick="goPage('val')"><i class="ti ti-chart-bar"></i>Valuación</button>
    <button class="nb" id="nb-ped" onclick="goPage('ped')"><i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc1"></span></button>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="page" id="p-prods">
  <div class="tb">
    <button class="ib" onclick="goPage('cats')"><i class="ti ti-arrow-left"></i></button>
    <span class="tb-t" id="prod-title"></span>
    <button class="ib" onclick="addSugeridos()" title="Agregar sugeridos"><i class="ti ti-sparkles"></i></button>
  </div>
  <div class="sc" id="prods-sc"></div>
</div>

<!-- VENTAS -->
<div class="page" id="p-ventas">
  <div class="tb">
    <span class="tb-t">Más vendidos</span>
    <button class="ib" onclick="doReloadVentas()" id="btn-reload-v"><i class="ti ti-refresh"></i></button>
  </div>
  <div class="tab-row">
    <div class="tab on" id="tab-mes" onclick="switchVentasTab('mes')">Último mes</div>
    <div class="tab" id="tab-hist" onclick="switchVentasTab('hist')">Histórico</div>
  </div>
  <div class="sc" id="ventas-sc"></div>
  <div class="bn">
    <button class="nb" id="nb2-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb on" id="nb2-ventas" onclick="goPage('ventas')"><i class="ti ti-trending-up"></i>Ventas</button>
    <button class="nb" id="nb2-val" onclick="goPage('val')"><i class="ti ti-chart-bar"></i>Valuación</button>
    <button class="nb" id="nb2-ped" onclick="goPage('ped')"><i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc2"></span></button>
  </div>
</div>

<!-- PEDIDO -->
<div class="page" id="p-ped">
  <div class="tb">
    <span class="tb-t">Pedido</span>
    <button class="ib" onclick="pdfAll()"><i class="ti ti-download"></i></button>
  </div>
  <div class="sc pad" id="ped-sc"></div>
  <div class="bn">
    <button class="nb" id="nb3-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb" id="nb3-ventas" onclick="goPage('ventas')"><i class="ti ti-trending-up"></i>Ventas</button>
    <button class="nb" id="nb3-val" onclick="goPage('val')"><i class="ti ti-chart-bar"></i>Valuación</button>
    <button class="nb on" id="nb3-ped" onclick="goPage('ped')"><i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc3"></span></button>
  </div>
</div>

<!-- VALUACIÓN -->
<div class="page" id="p-val">
  <div class="tb">
    <span class="tb-t">Valuación de stock</span>
    <button class="ib" onclick="renderVal()"><i class="ti ti-refresh"></i></button>
  </div>
  <div class="sc" id="val-sc"></div>
  <div class="bn">
    <button class="nb" id="nb4-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb" id="nb4-ventas" onclick="goPage('ventas')"><i class="ti ti-trending-up"></i>Ventas</button>
    <button class="nb on" id="nb4-val" onclick="goPage('val')"><i class="ti ti-chart-bar"></i>Valuación</button>
    <button class="nb" id="nb4-ped" onclick="goPage('ped')"><i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc4"></span></button>
  </div>
</div>


</div>
<script>
// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
const TOKEN   = 'ea72d0bcfe4a438aad213a106c9aea46';
const CORRECT_PIN = '0084';
const SIN_CAT = '__sin_proveedor__';

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let ITEMS = [], CATS = [], INV = {}, STORE = '', CAT = '';
let PEDIDO = {};
let VENTAS_MES  = [];   // [{ vid, nombre, catId, sku, qty, revenue }]
let VENTAS_HIST = [];
let VENTAS_TAB  = 'mes';
let VENTAS_LOADED = false;

// ══════════════════════════════════════════════════════════════
// PIN
// ══════════════════════════════════════════════════════════════
let pinInput = '';

function pinKey(k) {
  if (pinInput.length >= 4) return;
  pinInput += k;
  updatePinDots();
  if (pinInput.length === 4) {
    setTimeout(() => {
      if (pinInput === CORRECT_PIN) {
        document.getElementById('p-pin').classList.remove('on');
        startApp();
      } else {
        document.getElementById('pin-err').textContent = 'PIN incorrecto';
        pinInput = '';
        updatePinDots();
        // Shake
        const dots = document.getElementById('pin-dots');
        dots.style.animation = 'none';
        dots.offsetHeight;
        dots.style.animation = 'shake .3s ease';
      }
    }, 100);
  }
}

function pinDel() {
  if (!pinInput.length) return;
  pinInput = pinInput.slice(0, -1);
  document.getElementById('pin-err').textContent = '';
  updatePinDots();
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinInput.length);
  }
}

// CSS shake animation
const shakeStyle = document.createElement('style');
shakeStyle.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}';
document.head.appendChild(shakeStyle);

// ══════════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════════
async function apiFetch(path) {
  const url = 'https://api.loyverse.com/v1.0' + path;
  const h = { 'Authorization': 'Bearer ' + TOKEN };
  try {
    const r = await fetch(url, { headers: h });
    if (r.ok) return r.json();
    throw new Error('HTTP ' + r.status);
  } catch(e) {
    const r2 = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { headers: h });
    if (!r2.ok) throw new Error('Error ' + r2.status);
    return r2.json();
  }
}

async function apiAll(path, key, extra = '') {
  let out = [], cursor = null;
  do {
    const sep = extra.includes('?') ? '&' : '?';
    const d = await apiFetch(path + extra + (cursor ? sep + 'cursor=' + cursor : ''));
    out = out.concat(d[key] || []);
    cursor = d.cursor || null;
  } while (cursor);
  return out;
}

// ══════════════════════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════════════════════
async function startApp() {
  document.getElementById('cats-sc').innerHTML = '<div class="ldg"><div class="spin"></div>Cargando datos…</div>';
  document.getElementById('p-cats').classList.add('on');
  try {
    await loadAll();
    goPage('cats');
  } catch(e) {
    document.getElementById('cats-sc').innerHTML = '<div class="empty"><i class="ti ti-alert-circle"></i>' + e.message + '</div>';
  }
}

async function loadAll() {
  const sd = await apiFetch('/stores');
  const stores = sd.stores || [];
  STORE = stores[0]?.id || '';
  const sel = document.getElementById('ss');
  sel.innerHTML = stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  sel.value = STORE;

  [CATS, ITEMS] = await Promise.all([
    apiAll('/categories', 'categories'),
    apiAll('/items', 'items'),
  ]);

  const rawInv = await apiAll('/inventory', 'inventory_levels');
  buildINV(rawInv);
}

function buildINV(rawInv) {
  const byV = {};
  rawInv.forEach(r => {
    if (!byV[r.variant_id]) byV[r.variant_id] = [];
    byV[r.variant_id].push(r);
  });
  INV = {};
  Object.entries(byV).forEach(([vid, recs]) => {
    const src = recs.filter(r => r.store_id === STORE);
    const use = src.length ? src : recs;
    INV[vid] = use.reduce((s, r) => s + (parseFloat(r.in_stock) || 0), 0);
  });
}

async function doReload() {
  document.getElementById('cats-sc').innerHTML = '<div class="ldg"><div class="spin"></div>Actualizando…</div>';
  PEDIDO = {}; updateBadge();
  try { await loadAll(); renderCats(); } catch(e) {}
}

function onStore() {
  STORE = document.getElementById('ss').value;
  doReload();
}

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
const getVarId   = v  => v.variant_id;
const getStock   = id => INV[id] !== undefined ? INV[id] : null;
const getLowStock = v => (v.stores || []).find(s => s.store_id === STORE)?.low_stock || v.low_stock || 0;

function getEstado(vid, min) {
  const s = getStock(vid);
  if (s === null) return 'ok';
  if (s <= 0) return 'crit';
  if (min > 0 && s < min) return 'low';
  return 'ok';
}

const eLabel = e => ({ ok:'Normal', low:'Bajo', crit:'Sin stock' }[e]);
const eBadge = e => ({ ok:'bok', low:'blow', crit:'bcrit' }[e]);
const catLabel = id => (CATS.find(c => c.id === id) || { name:'Sin proveedor' }).name;

function varsByCat(catId) {
  const predicate = catId === SIN_CAT
    ? item => !item.category_id
    : item => item.category_id === catId;
  const out = [];
  ITEMS.filter(predicate).forEach(item => {
    (item.variants || []).forEach(v => {
      const vid = getVarId(v);
      const min = getLowStock(v);
      out.push({ vid, nombre: item.item_name + (v.option1_value ? ' — '+v.option1_value : ''), sku: v.sku||'', costo: v.cost||0, min, stock: getStock(vid), est: getEstado(vid, min) });
    });
  });
  return out;
}

function varById(vid) {
  for (const item of ITEMS) {
    const v = (item.variants||[]).find(x => getVarId(x) === vid);
    if (v) return { vid, nombre: item.item_name+(v.option1_value?' — '+v.option1_value:''), sku: v.sku||'', costo: v.cost||0, catId: item.category_id || SIN_CAT };
  }
  return null;
}

function totalUnits() { return Object.values(PEDIDO).reduce((s,q) => s+q, 0); }

function updateBadge() {
  const t = totalUnits();
  ['cc1','cc2','cc3','cc4'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = t;
    el.style.display = t > 0 ? 'flex' : 'none';
  });
}

// ══════════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════════
function goPage(name) {
  ['cats','prods','ventas','ped'].forEach(n => document.getElementById('p-'+n).classList.remove('on'));
  document.getElementById('p-'+name).classList.add('on');
  ['nb-cats','nb-ventas','nb-val','nb-ped','nb2-cats','nb2-ventas','nb2-val','nb2-ped','nb3-cats','nb3-ventas','nb3-val','nb3-ped','nb4-cats','nb4-ventas','nb4-val','nb4-ped'].forEach(id => {
    const el = document.getElementById(id); if (el) el.classList.remove('on');
  });
  ['nb-'+name,'nb2-'+name,'nb3-'+name].forEach(id => {
    const el = document.getElementById(id); if (el) el.classList.add('on');
  });
  if (name === 'cats')   renderCats();
  if (name === 'prods')  renderProds();
  if (name === 'ventas') renderVentas();
  if (name === 'val')    renderVal();
  if (name === 'ped')    renderPedido();
}

// ══════════════════════════════════════════════════════════════
// RENDER CATS
// ══════════════════════════════════════════════════════════════
function addCatRow(el, id, name, vars, icon, color) {
  const crit  = vars.filter(v => v.est === 'crit').length;
  const low   = vars.filter(v => v.est === 'low').length;
  const inPed = vars.reduce((s, v) => s + (PEDIDO[v.vid]||0), 0);
  const div = document.createElement('div');
  div.className = 'cr';
  div.innerHTML = `
    <div class="ci" style="background:${color}"><i class="ti ${icon}"></i></div>
    <div class="cn">
      <div class="cn-name">${name}</div>
      <div class="cn-sub">${vars.length} producto${vars.length!==1?'s':''}</div>
      <div class="cn-b">
        ${crit  ? `<span class="badge bcrit">${crit} sin stock</span>` : ''}
        ${low   ? `<span class="badge blow">${low} bajo</span>` : ''}
        ${inPed ? `<span class="badge bok">${inPed} en pedido</span>` : ''}
      </div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px;flex-shrink:0"></i>`;
  div.onclick = () => { CAT = id; document.getElementById('prod-title').textContent = name; goPage('prods'); };
  el.appendChild(div);
}

function renderCats() {
  const el = document.getElementById('cats-sc');
  el.innerHTML = '';
  let shown = 0;
  [...CATS].sort((a,b) => a.name.localeCompare(b.name)).forEach(cat => {
    const vars = varsByCat(cat.id);
    if (!vars.length) return;
    shown++;
    addCatRow(el, cat.id, cat.name, vars, 'ti-tag', 'var(--blue)');
  });
  const sinCat = varsByCat(SIN_CAT);
  if (sinCat.length) {
    shown++;
    const sep = document.createElement('div');
    sep.className = 'sep';
    sep.textContent = 'Sin proveedor asignado';
    el.appendChild(sep);
    addCatRow(el, SIN_CAT, `Sin proveedor asignado (${sinCat.length})`, sinCat, 'ti-alert-circle', '#854F0B');
  }
  if (!shown) el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Sin productos.</div>';
}

// ══════════════════════════════════════════════════════════════
// RENDER PRODS
// ══════════════════════════════════════════════════════════════
function renderProds() {
  const el = document.getElementById('prods-sc');
  el.innerHTML = '';
  const vars = varsByCat(CAT);
  if (!vars.length) { el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Sin productos.</div>'; return; }
  vars.forEach(v => {
    const barColor = v.est==='crit'?'#E24B4A':v.est==='low'?'#EF9F27':'#639922';
    const pct = v.stock > 0 ? (v.min ? Math.min(100, Math.round(v.stock/(v.min*2)*100)) : 60) : 0;
    const qty = PEDIDO[v.vid] || 0;
    const row = document.createElement('div');
    row.className = 'pr';
    row.innerHTML = `
      <div class="pm">
        <div class="pname">${v.nombre}</div>
        ${v.sku ? `<div class="psku">SKU: ${v.sku}</div>` : ''}
        <div class="pst">
          <span class="snum">${v.stock===null?'—':v.stock}</span>
          <span class="badge ${eBadge(v.est)}">${eLabel(v.est)}</span>
          <span class="pb"><span class="pbf" style="width:${pct}%;background:${barColor}"></span></span>
        </div>
      </div>
      <div class="qc">
        <div class="qb minus">−</div>
        <div class="qnum">${qty||''}</div>
        <div class="qb add">+</div>
      </div>`;
    const vid = v.vid;
    const mEl = row.querySelector('.minus');
    const pEl = row.querySelector('.add');
    const qEl = row.querySelector('.qnum');
    const sync = () => { const q=PEDIDO[vid]||0; mEl.style.opacity=q>0?'1':'.3'; mEl.style.pointerEvents=q>0?'auto':'none'; };
    sync();
    pEl.onclick = () => { PEDIDO[vid]=(PEDIDO[vid]||0)+1; qEl.textContent=PEDIDO[vid]; sync(); updateBadge(); };
    mEl.onclick = () => { if(!PEDIDO[vid])return; PEDIDO[vid]--; if(!PEDIDO[vid])delete PEDIDO[vid]; qEl.textContent=PEDIDO[vid]||''; sync(); updateBadge(); };
    el.appendChild(row);
  });
}

function addSugeridos() {
  const vars = varsByCat(CAT).filter(v => v.est !== 'ok');
  if (!vars.length) { alert('No hay productos con stock bajo o sin stock.'); return; }
  vars.forEach(v => { PEDIDO[v.vid] = Math.max(1, (v.min||5)*2 - Math.max(v.stock||0,0)); });
  updateBadge(); renderProds();
}

// ══════════════════════════════════════════════════════════════
// VENTAS — cargar receipts y calcular ranking
// ══════════════════════════════════════════════════════════════
async function loadVentas() {
  const el = document.getElementById('ventas-sc');
  el.innerHTML = '<div class="ldg"><div class="spin"></div>Cargando ventas…<br><small style="color:var(--text3)">Esto puede tardar unos segundos</small></div>';

  // Mapa acumulador: vid → { qty, revenue, nombre, catId, sku }
  const acumMes  = {};
  const acumHist = {};

  const desde = new Date();
  desde.setDate(desde.getDate() - 30);
  const desdeISO = desde.toISOString().slice(0, 19) + 'Z';

  // Cargar histórico (sin filtro de fecha) — paginado
  let cursor = null, pages = 0;
  do {
    const extra = '?store_id=' + STORE + '&limit=250' + (cursor ? '&cursor='+cursor : '');
    const d = await apiFetch('/receipts' + extra);
    const receipts = d.receipts || [];
    receipts.forEach(r => {
      const esMes = r.receipt_date >= desdeISO;
      (r.line_items || []).forEach(li => {
        const vid = li.variant_id;
        if (!vid) return;
        const qty = parseFloat(li.quantity) || 0;
        const rev = parseFloat(li.total_money) || 0;
        // Histórico
        if (!acumHist[vid]) acumHist[vid] = { qty:0, revenue:0 };
        acumHist[vid].qty     += qty;
        acumHist[vid].revenue += rev;
        // Mes
        if (esMes) {
          if (!acumMes[vid]) acumMes[vid] = { qty:0, revenue:0 };
          acumMes[vid].qty     += qty;
          acumMes[vid].revenue += rev;
        }
      });
    });
    cursor = d.cursor || null;
    pages++;
    // Actualizar mensaje de carga
    el.innerHTML = `<div class="ldg"><div class="spin"></div>Cargando ventas… (${pages * 250}+)<br><small style="color:var(--text3)">Procesando historial completo</small></div>`;
  } while (cursor && pages < 100); // máximo 25.000 receipts

  // Construir ranking enriquecido con datos del producto
  const enrich = (acum) => Object.entries(acum)
    .map(([vid, d]) => {
      const info = varById(vid);
      return { vid, qty: d.qty, revenue: d.revenue, nombre: info?.nombre || vid, catId: info?.catId || SIN_CAT, sku: info?.sku || '' };
    })
    .filter(x => x.qty > 0)
    .sort((a,b) => b.qty - a.qty)
    .slice(0, 50);

  VENTAS_MES  = enrich(acumMes);
  VENTAS_HIST = enrich(acumHist);
  VENTAS_LOADED = true;
}

async function doReloadVentas() {
  VENTAS_LOADED = false;
  await renderVentas();
}

async function renderVentas() {
  if (!VENTAS_LOADED) {
    try { await loadVentas(); } catch(e) {
      document.getElementById('ventas-sc').innerHTML = '<div class="empty"><i class="ti ti-alert-circle"></i>Error cargando ventas: ' + e.message + '</div>';
      return;
    }
  }
  const data = VENTAS_TAB === 'mes' ? VENTAS_MES : VENTAS_HIST;
  const el = document.getElementById('ventas-sc');
  el.innerHTML = '';

  if (!data.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-trending-up"></i>Sin datos de ventas disponibles.</div>';
    return;
  }

  data.forEach((item, i) => {
    const pos = i + 1;
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = `
      <div class="rank-pos ${pos <= 3 ? 'top' : ''}">${pos}</div>
      <div class="rank-info">
        <div class="rank-name">${item.nombre}</div>
        <div class="rank-cat">${catLabel(item.catId)}${item.sku ? ' · ' + item.sku : ''}</div>
      </div>
      <div>
        <div class="rank-qty">${item.qty} ud.</div>
        ${item.revenue ? `<div class="rank-sub">$${Math.round(item.revenue).toLocaleString('es-AR')}</div>` : ''}
      </div>`;
    el.appendChild(row);
  });
}

function switchVentasTab(tab) {
  VENTAS_TAB = tab;
  document.getElementById('tab-mes').classList.toggle('on', tab === 'mes');
  document.getElementById('tab-hist').classList.toggle('on', tab === 'hist');
  renderVentas();
}


// ══════════════════════════════════════════════════════════════
// VALUACIÓN
// ══════════════════════════════════════════════════════════════
function calcVal() {
  // Resultado: { total, porCat: { catId: { nombre, valor, unidades, productos } } }
  let total = 0;
  const porCat = {};

  const addToCat = (catId, catNombre, valor, unidades) => {
    if (!porCat[catId]) porCat[catId] = { nombre: catNombre, valor: 0, unidades: 0, productos: 0 };
    porCat[catId].valor    += valor;
    porCat[catId].unidades += unidades;
    porCat[catId].productos++;
    total += valor;
  };

  ITEMS.forEach(item => {
    const catId     = item.category_id || SIN_CAT;
    const catNombre = item.category_id ? catLabel(item.category_id) : 'Sin proveedor';
    (item.variants || []).forEach(v => {
      const vid   = getVarId(v);
      const stock = INV[vid] ?? 0;
      const costo = v.cost || 0;
      if (stock > 0 && costo > 0) {
        addToCat(catId, catNombre, stock * costo, stock);
      } else if (stock > 0) {
        // Tiene stock pero sin costo cargado — contarlo igual
        addToCat(catId, catNombre, 0, stock);
      }
    });
  });

  return { total, porCat };
}

function renderVal() {
  const el = document.getElementById('val-sc');
  const { total, porCat } = calcVal();

  // Contar productos sin costo
  let sinCosto = 0;
  ITEMS.forEach(item => (item.variants||[]).forEach(v => { if ((INV[getVarId(v)]??0) > 0 && !v.cost) sinCosto++; }));

  const totalItems = ITEMS.reduce((s, item) => s + (item.variants||[]).length, 0);
  const totalUnidadesStock = Object.values(INV).reduce((s, q) => s + Math.max(q, 0), 0);

  el.innerHTML = '';

  // Hero card
  const hero = document.createElement('div');
  hero.className = 'val-hero';
  hero.innerHTML = `
    <div class="val-hero-label">Valor total del stock (a precio costo)</div>
    <div class="val-hero-amount">$${Math.round(total).toLocaleString('es-AR')}</div>
    <div class="val-hero-sub">${totalUnidadesStock} unidades · ${totalItems} variantes${sinCosto ? ' · ⚠ '+sinCosto+' sin costo cargado' : ''}</div>`;
  el.appendChild(hero);

  // Por categoría — ordenado por valor desc
  const sec = document.createElement('div');
  sec.className = 'val-section';
  sec.textContent = 'Por proveedor';
  el.appendChild(sec);

  const sorted = Object.entries(porCat).sort((a,b) => b[1].valor - a[1].valor);

  sorted.forEach(([catId, d]) => {
    const row = document.createElement('div');
    row.className = 'val-cat-row';
    const pct = total > 0 ? Math.round((d.valor / total) * 100) : 0;
    row.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="val-cat-name">${d.nombre}</div>
        <div style="margin-top:4px;height:3px;background:var(--bg3);border-radius:9px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--blue);border-radius:9px"></div>
        </div>
      </div>
      <div class="val-cat-right">
        <div class="val-cat-amount">${d.valor > 0 ? '$'+Math.round(d.valor).toLocaleString('es-AR') : '—'}</div>
        <div class="val-cat-sub">${d.unidades} ud · ${pct}%</div>
      </div>`;
    el.appendChild(row);
  });
}

// ══════════════════════════════════════════════════════════════
// PEDIDO
// ══════════════════════════════════════════════════════════════
function renderPedido() {
  const el = document.getElementById('ped-sc');
  el.innerHTML = '';
  const byCat = {};
  Object.entries(PEDIDO).forEach(([vid, qty]) => {
    if (qty <= 0) return;
    const data = varById(vid);
    if (!data) return;
    const cid = data.catId || SIN_CAT;
    if (!byCat[cid]) byCat[cid] = [];
    byCat[cid].push({ ...data, qty });
  });
  const cids = Object.keys(byCat);
  if (!cids.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-shopping-cart"></i>El pedido está vacío.<br>Entrá a un proveedor y tocá + en los productos.</div>';
    return;
  }
  cids.forEach(cid => {
    const items = byCat[cid];
    const total = items.reduce((s,i) => s+i.qty*(i.costo||0), 0);
    const card = document.createElement('div');
    card.className = 'pc';
    const hdr = document.createElement('div');
    hdr.className = 'ph';
    hdr.innerHTML = `<div class="phn"><i class="ti ti-tag" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>${catLabel(cid)}</div>`;
    const pb = document.createElement('button');
    pb.className = 'btns bg'; pb.innerHTML = '<i class="ti ti-download"></i> PDF';
    pb.onclick = () => pdfCat(cid, items);
    hdr.appendChild(pb); card.appendChild(hdr);
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'prow';
      row.innerHTML = `
        <div class="prn">${item.nombre}${item.sku?'<br><span style="font-size:10px;color:var(--text3)">'+item.sku+'</span>':''}</div>
        <div class="prq">
          <div class="qb" style="width:28px;height:28px;font-size:17px">−</div>
          <div class="qnum" style="min-width:22px;font-size:13px">${item.qty}</div>
          <div class="qb" style="width:28px;height:28px;font-size:17px">+</div>
          <div class="qb" style="width:28px;height:28px;font-size:13px;color:var(--red-text)"><i class="ti ti-trash"></i></div>
        </div>`;
      const vid=item.vid, qEl=row.querySelector('.qnum'), btns=row.querySelectorAll('.qb');
      btns[0].onclick=()=>{const c=PEDIDO[vid]||0;if(!c)return;PEDIDO[vid]=c-1;if(!PEDIDO[vid]){delete PEDIDO[vid];updateBadge();renderPedido();return;}qEl.textContent=PEDIDO[vid];updateBadge();};
      btns[1].onclick=()=>{PEDIDO[vid]=(PEDIDO[vid]||0)+1;qEl.textContent=PEDIDO[vid];updateBadge();};
      btns[2].onclick=()=>{delete PEDIDO[vid];updateBadge();renderPedido();};
      card.appendChild(row);
    });
    const tot=document.createElement('div');
    tot.className='ptot';
    tot.innerHTML=`<span style="color:var(--text2)">Total estimado:</span><strong>${total?'$'+total.toLocaleString('es-AR'):'—'}</strong>`;
    card.appendChild(tot); el.appendChild(card);
  });
}

// ══════════════════════════════════════════════════════════════
// PDF
// ══════════════════════════════════════════════════════════════
function pdfHdr(doc, title) {
  doc.setFillColor(24,95,165); doc.rect(0,0,210,26,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text(title,14,15);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),14,22);
  doc.setTextColor(40,40,40);
}
function pdfFtr(doc) {
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(150);doc.line(14,287,196,287);doc.text('Pág.'+i+'/'+n,196,292,{align:'right'});doc.text('Stock & Pedidos',14,292);}
}
function buildTbl(doc, items, y) {
  const total=items.reduce((s,i)=>s+i.qty*(i.costo||0),0);
  doc.autoTable({head:[['Producto','SKU','Cant.','Precio','Subtotal']],body:items.map(i=>[i.nombre,i.sku||'—',i.qty,i.costo?'$'+i.costo.toLocaleString('es-AR'):'—',i.costo?'$'+(i.qty*i.costo).toLocaleString('es-AR'):'—']),foot:[['','','','Total:',total?'$'+total.toLocaleString('es-AR'):'—']],startY:y,styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold'},footStyles:{fillColor:[230,241,251],textColor:[12,68,124],fontStyle:'bold'},alternateRowStyles:{fillColor:[248,248,246]},columnStyles:{2:{halign:'center'},3:{halign:'right'},4:{halign:'right'}}});
}
function pdfCat(cid, items) {
  if(!items?.length){alert('Sin productos.');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF();
  pdfHdr(doc,'Pedido — '+catLabel(cid)); buildTbl(doc,items,32); pdfFtr(doc);
  doc.save('pedido-'+catLabel(cid).replace(/\s+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.pdf');
}
function pdfAll() {
  const byCat={};
  Object.entries(PEDIDO).forEach(([vid,qty])=>{if(!qty)return;const d=varById(vid);if(!d)return;const c=d.catId||SIN_CAT;if(!byCat[c])byCat[c]=[];byCat[c].push({...d,qty});});
  const cids=Object.keys(byCat);
  if(!cids.length){alert('El pedido está vacío.');return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF();let first=true;
  cids.forEach(cid=>{const items=byCat[cid];if(!items.length)return;if(!first)doc.addPage();first=false;pdfHdr(doc,'Pedido — '+catLabel(cid));buildTbl(doc,items,32);});
  pdfFtr(doc);
  doc.save('pedidos-'+new Date().toISOString().slice(0,10)+'.pdf');
}
