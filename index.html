<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Stock & Pedidos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9b9b97;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.20);
  --blue:#185FA5;--green:#3B6D11;
  --green-bg:#EAF3DE;--green-text:#27500A;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red-bg:#FCEBEB;--red-text:#A32D2D;
  --r:10px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#f0efe9;--text2:#9b9b97;--text3:#6b6b68;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --green-bg:#1a3308;--green-text:#97C459;
  --amber-bg:#2e1e04;--amber-text:#EF9F27;
  --red-bg:#2e0d0d;--red-text:#F09595;
}}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px}

/* Layout */
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.page{display:none;flex-direction:column;flex:1}
.page.on{display:flex}

/* Topbar */
.tb{display:flex;align-items:center;padding:0 8px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0;gap:4px;background:var(--bg)}
.tb-title{font-size:16px;font-weight:600;flex:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:none;background:none;cursor:pointer;color:var(--text);font-size:22px;-webkit-tap-highlight-color:transparent}
.ib:active{background:var(--bg2)}

/* Bottom nav */
.bn{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:10px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;position:relative}
.nb i{font-size:22px}
.nb.on{color:var(--blue)}
.cc{position:absolute;top:3px;right:2px;min-width:16px;height:16px;background:var(--blue);color:#fff;border-radius:99px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px}

/* Scroll */
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 14px}

/* Connect */
.cw{padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.clogo{width:60px;height:60px;background:var(--blue);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:0 auto}
h1{font-size:20px;font-weight:700;text-align:center}
.sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6}
.lbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none}
input[type=password]:focus{border-color:var(--blue)}
.hint{font-size:12px;color:var(--text3);line-height:1.6;text-align:center}
.err{background:var(--red-bg);color:var(--red-text);font-size:12px;padding:10px 13px;border-radius:var(--r);display:none}
.log{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:11px;font-family:monospace;max-height:160px;overflow-y:auto;display:none;color:var(--text2);line-height:1.7;word-break:break-all}
.log .ok{color:var(--green-text)}.log .er{color:var(--red-text)}.log .in{color:#185FA5}

/* Buttons */
.btnp{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btnp:disabled{opacity:.5}
.btns{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btns:active{opacity:.75}
.bg{background:var(--green);color:#fff}

/* Badges */
.badge{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bok{background:var(--green-bg);color:var(--green-text)}
.blow{background:var(--amber-bg);color:var(--amber-text)}
.bcrit{background:var(--red-bg);color:var(--red-text)}

/* Cat rows */
.cr{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;gap:12px}
.cr:active{background:var(--bg2)}
.ci{width:40px;height:40px;border-radius:var(--r);background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.cn{flex:1;min-width:0}
.cn-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn-sub{font-size:12px;color:var(--text2);margin-top:2px}
.cn-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* Product rows */
.pr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.pm{flex:1;min-width:0}
.pname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psku{font-size:11px;color:var(--text3);margin-top:1px}
.pst{display:flex;align-items:center;gap:8px;margin-top:5px}
.sn{font-size:14px;font-weight:700}
.pb{width:48px;height:3px;background:var(--bg3);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbf{height:100%;border-radius:9px;display:block}

/* Qty */
.qc{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qb{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;flex-shrink:0}
.qb:active{background:var(--bg3)}
.qb.plus{background:var(--blue);color:#fff;border-color:var(--blue)}
.qn{min-width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--text)}

/* Pedido */
.pc{margin-bottom:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg2);gap:8px}
.phn{font-size:14px;font-weight:600}
.prow{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--border);gap:10px}
.prn{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prq{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ptot{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;gap:6px;background:var(--bg2)}

/* Misc */
.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:13px;line-height:1.7}
.empty i{font-size:36px;display:block;margin:0 auto 12px;color:var(--text3)}
.ldg{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--text2);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ss{padding:6px 10px;border:1px solid var(--border2);border-radius:99px;font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none;max-width:120px}
</style>
</head>
<body>
<div class="app">

<!-- CONNECT -->
<div class="page on" id="p-con">
  <div class="sc"><div class="cw">
    <div class="clogo"><i class="ti ti-building-store"></i></div>
    <h1>Stock & Pedidos</h1>
    <div class="sub">Conectate a Loyverse para ver stock por proveedor y armar pedidos.</div>
    <div><div class="lbl">Token de acceso</div>
      <input type="password" id="tok" placeholder="Pegá tu Bearer token…"/>
    </div>
    <button class="btnp" id="btncon" onclick="doConnect()"><i class="ti ti-plug"></i> Conectar</button>
    <div class="log" id="logbox"></div>
    <div class="err" id="errbox"></div>
    <div class="hint">Loyverse → Configuración → Integraciones → API de acceso</div>
  </div></div>
</div>

<!-- PROVEEDORES -->
<div class="page" id="p-cats">
  <div class="tb">
    <span class="tb-title">Proveedores</span>
    <select class="ss" id="ss" onchange="onStore()"></select>
    <button class="ib" onclick="doReload()"><i class="ti ti-refresh"></i></button>
  </div>
  <div class="sc" id="cats-sc"></div>
  <div class="bn">
    <button class="nb on" id="nb-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb" id="nb-ped" onclick="goPage('ped')">
      <i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc1"></span>
    </button>
    <button class="nb" onclick="doLogout()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="page" id="p-prods">
  <div class="tb">
    <button class="ib" onclick="goPage('cats')"><i class="ti ti-arrow-left"></i></button>
    <span class="tb-title" id="prod-title"></span>
    <button class="ib" onclick="addAll()" title="Sugeridos"><i class="ti ti-sparkles"></i></button>
  </div>
  <div class="sc" id="prods-sc"></div>
</div>

<!-- PEDIDO -->
<div class="page" id="p-ped">
  <div class="tb">
    <span class="tb-title">Pedido</span>
    <button class="ib" onclick="pdfAll()"><i class="ti ti-download"></i></button>
  </div>
  <div class="sc pad" id="ped-sc"></div>
  <div class="bn">
    <button class="nb" id="nb2-cats" onclick="goPage('cats')"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb on" id="nb2-ped" onclick="goPage('ped')">
      <i class="ti ti-shopping-cart"></i>Pedido<span class="cc" id="cc2"></span>
    </button>
    <button class="nb" onclick="doLogout()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

</div>
<script>
// ══════════════════════════════════════════════════════════════════════
// ESTADO GLOBAL — un solo objeto, simple y plano
// ══════════════════════════════════════════════════════════════════════
let TOKEN = '';
let ITEMS = [];       // items de Loyverse
let INV   = {};       // { variantId: in_stock }  ← índice plano
let CATS  = [];       // categorías
let STORES= [];
let STORE = '';       // id de tienda activa
let CAT   = '';       // id de categoría abierta

// PEDIDO: objeto plano  { variantId: qty }
// Solo un nivel, sin agrupación por categoría en memoria
// La categoría se deduce buscando en ITEMS cuando hace falta
let PEDIDO = {};

// ══════════════════════════════════════════════════════════════════════
// LOG
// ══════════════════════════════════════════════════════════════════════
function log(msg, t='in') {
  const el = document.getElementById('logbox');
  el.style.display = 'block';
  const d = document.createElement('div');
  d.className = t;
  d.textContent = (t==='ok'?'✓ ':t==='er'?'✗ ':'→ ') + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function clearLog() {
  const el = document.getElementById('logbox');
  el.innerHTML = ''; el.style.display = 'none';
}

// ══════════════════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════════════════
async function api(path) {
  const url = 'https://api.loyverse.com/v1.0' + path;
  const h = { 'Authorization': 'Bearer ' + TOKEN };
  try {
    const r = await fetch(url, { headers: h });
    if (r.ok) return r.json();
    throw new Error('HTTP ' + r.status);
  } catch(e) {
    const r2 = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { headers: h });
    if (!r2.ok) throw new Error('Error ' + r2.status);
    return r2.json();
  }
}

async function apiAll(path, key, extra='') {
  let out = [], cursor = null;
  do {
    const sep = extra.includes('?') ? '&' : '?';
    const d = await api(path + extra + (cursor ? sep+'cursor='+cursor : ''));
    out = out.concat(d[key] || []);
    cursor = d.cursor || null;
  } while(cursor);
  return out;
}

// ══════════════════════════════════════════════════════════════════════
// CONNECT & LOAD
// ══════════════════════════════════════════════════════════════════════
async function doConnect() {
  const t = document.getElementById('tok').value.trim();
  const btn = document.getElementById('btncon');
  const err = document.getElementById('errbox');
  if (!t) { err.textContent = 'Ingresá el token.'; err.style.display = 'block'; return; }
  TOKEN = t;
  err.style.display = 'none';
  clearLog();
  btn.disabled = true;
  btn.innerHTML = '<div class="spin" style="width:18px;height:18px;border-width:2px"></div> Conectando…';
  try {
    await loadAll();
    goPage('cats');
  } catch(e) {
    TOKEN = '';
    log('ERROR: ' + e.message, 'er');
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-plug"></i> Conectar';
  }
}

async function loadAll() {
  log('Cargando tiendas…');
  const sd = await api('/stores');
  STORES = sd.stores || [];
  log('Tiendas: ' + STORES.map(s=>s.name).join(', '), 'ok');

  log('Cargando categorías…');
  CATS = await apiAll('/categories', 'categories');
  log('Categorías: ' + CATS.length, 'ok');

  log('Cargando productos…');
  ITEMS = await apiAll('/items', 'items');
  log('Productos: ' + ITEMS.length, 'ok');

  // Debug: ver estructura de un item
  if (ITEMS.length) {
    const s = ITEMS[0];
    log('Item keys: ' + Object.keys(s).join(', '), 'in');
    log('category_id: "' + s.category_id + '"', 'in');
    if (s.variants?.[0]) log('variant[0] id: "' + s.variants[0].id + '"', 'in');
  }

  log('Cargando inventario…');
  // Traer TODO el inventario sin filtro de tienda — un solo fetch
  const rawInv = await apiAll('/inventory', 'inventory_levels');
  log('Inv total: ' + rawInv.length + ' registros', 'ok');

  // Debug: ver estructura de un registro
  if (rawInv.length) {
    const s = rawInv[0];
    log('Inv keys: ' + Object.keys(s).join(', '), 'in');
    log('store_id:"'+s.store_id+'" variant_id:"'+s.variant_id+'" in_stock:'+s.in_stock, 'in');
  }

  // Store por defecto
  STORE = STORES[0]?.id || '';
  const sel = document.getElementById('ss');
  sel.innerHTML = STORES.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  sel.value = STORE;

  // Construir índice INV: { variantId → in_stock }
  // Si hay múltiples tiendas, filtrar por STORE; si no hay match, sumar todas
  buildInvIndex(rawInv);

  // Cross-check
  if (ITEMS.length && Object.keys(INV).length) {
    const vid = ITEMS[0].variants?.[0]?.id;
    const stock = INV[vid];
    log('Cross-check variant "'+vid+'": stock=' + (stock !== undefined ? stock : 'NO ENCONTRADO'), stock !== undefined ? 'ok' : 'er');
  }

  renderCats();
}

function buildInvIndex(rawInv) {
  INV = {};
  // Agrupar por variant_id
  const byVariant = {};
  rawInv.forEach(r => {
    if (!byVariant[r.variant_id]) byVariant[r.variant_id] = [];
    byVariant[r.variant_id].push(r);
  });
  // Para cada variante, elegir stock de la tienda activa
  Object.entries(byVariant).forEach(([vid, records]) => {
    const forStore = records.filter(r => r.store_id === STORE);
    const src = forStore.length ? forStore : records;
    INV[vid] = src.reduce((s, r) => s + (parseFloat(r.in_stock) || 0), 0);
  });
}

async function doReload() {
  document.getElementById('cats-sc').innerHTML = '<div class="ldg"><div class="spin"></div>Actualizando…</div>';
  try { await loadAll(); renderCats(); }
  catch(e) {
    document.getElementById('cats-sc').innerHTML = '<div class="empty"><i class="ti ti-alert-circle"></i>' + e.message + '</div>';
  }
}

function onStore() {
  STORE = document.getElementById('ss').value;
  // Reconstruir índice con tienda nueva
  // (rawInv no está guardado, así que pedimos de nuevo)
  doReload();
}

function doLogout() {
  TOKEN=''; ITEMS=[]; INV={}; CATS=[]; STORES=[]; STORE=''; CAT=''; PEDIDO={};
  clearLog();
  document.getElementById('tok').value = '';
  document.getElementById('errbox').style.display = 'none';
  goPage('con');
}

// ══════════════════════════════════════════════════════════════════════
// NAVEGACIÓN — sin animaciones, sin estado de pantalla
// ══════════════════════════════════════════════════════════════════════
function goPage(name) {
  // Ocultar todas
  ['con','cats','prods','ped'].forEach(n => {
    document.getElementById('p-'+n).classList.remove('on');
  });
  // Mostrar la pedida
  document.getElementById('p-'+name).classList.add('on');

  // Nav buttons
  ['nb-cats','nb-ped','nb2-cats','nb2-ped'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('on');
  });
  if (name === 'cats')  { document.getElementById('nb-cats')?.classList.add('on'); document.getElementById('nb2-cats')?.classList.add('on'); }
  if (name === 'ped')   { document.getElementById('nb-ped')?.classList.add('on');  document.getElementById('nb2-ped')?.classList.add('on'); }

  // Render
  if (name === 'cats')  renderCats();
  if (name === 'ped')   renderPedido();
}

// ══════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════
function getStock(vid) {
  return INV[vid] !== undefined ? INV[vid] : null;
}

function getEstado(vid, min) {
  const s = getStock(vid);
  if (s === null) return 'ok';
  if (s <= 0) return 'crit';
  if (min > 0 && s < min) return 's low';
  return 'ok';
}

function catLabel(id) {
  return (CATS.find(c => c.id === id) || { name: 'Sin categoría' }).name;
}

// Variantes de una categoría — devuelve objetos simples y planos
function varsByCat(catId) {
  const out = [];
  ITEMS.filter(item => item.category_id === catId).forEach(item => {
    (item.variants || []).forEach(v => {
      const stock = getStock(v.id);
      const min   = v.low_stock || item.low_stock || 0;
      const s     = stock === null ? null : stock;
      const est   = s === null ? 'ok' : s <= 0 ? 'crit' : (min > 0 && s < min ? 'low' : 'ok');
      out.push({
        vid:    v.id,
        nombre: item.item_name + (v.variant_name && v.variant_name !== item.item_name ? ' — ' + v.variant_name : ''),
        sku:    v.sku || '',
        costo:  v.cost || 0,
        min,
        stock:  s,
        est,
      });
    });
  });
  return out;
}

// Buscar datos de una variante por id
function varById(vid) {
  for (const item of ITEMS) {
    const v = (item.variants || []).find(x => x.id === vid);
    if (v) return {
      vid,
      nombre: item.item_name + (v.variant_name && v.variant_name !== item.item_name ? ' — '+v.variant_name : ''),
      sku:    v.sku || '',
      costo:  v.cost || 0,
      catId:  item.category_id || '',
    };
  }
  return null;
}

// Total de unidades en el pedido
function totalUnits() {
  return Object.values(PEDIDO).reduce((s, q) => s + q, 0);
}

function updateBadge() {
  const t = totalUnits();
  ['cc1','cc2'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = t;
    el.style.display = t > 0 ? 'flex' : 'none';
  });
}

// ══════════════════════════════════════════════════════════════════════
// RENDER CATS
// ══════════════════════════════════════════════════════════════════════
function renderCats() {
  const el = document.getElementById('cats-sc');
  el.innerHTML = '';
  const sorted = [...CATS].sort((a,b) => a.name.localeCompare(b.name));
  let shown = 0;
  sorted.forEach(cat => {
    const vars = varsByCat(cat.id);
    if (!vars.length) return;
    shown++;
    const crit  = vars.filter(v => v.est === 'crit').length;
    const low   = vars.filter(v => v.est === 'low').length;
    // Contar unidades en pedido para esta categoría
    let inPed = 0;
    vars.forEach(v => { inPed += PEDIDO[v.vid] || 0; });

    const div = document.createElement('div');
    div.className = 'cr';
    div.innerHTML = `
      <div class="ci"><i class="ti ti-tag"></i></div>
      <div class="cn">
        <div class="cn-name">${cat.name}</div>
        <div class="cn-sub">${vars.length} producto${vars.length!==1?'s':''}</div>
        <div class="cn-badges">
          ${crit ? `<span class="badge bcrit">${crit} sin stock</span>` : ''}
          ${low  ? `<span class="badge blow">${low} bajo</span>` : ''}
          ${inPed? `<span class="badge bok">${inPed} en pedido</span>` : ''}
        </div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px;flex-shrink:0"></i>`;
    div.onclick = () => openCat(cat.id, cat.name);
    el.appendChild(div);
  });
  if (!shown) {
    el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Sin productos con categoría asignada.<br>Verificá en Loyverse que los productos tengan categoría.</div>';
  }
}

// ══════════════════════════════════════════════════════════════════════
// RENDER PRODS
// Fuente de verdad de las cantidades: PEDIDO[vid]
// Cada + / − modifica PEDIDO y actualiza SOLO el elemento del DOM tocado
// ══════════════════════════════════════════════════════════════════════
function openCat(catId, name) {
  CAT = catId;
  document.getElementById('prod-title').textContent = name;
  goPage('prods');
  renderProds();
}

function renderProds() {
  const el = document.getElementById('prods-sc');
  el.innerHTML = '';
  const vars = varsByCat(CAT);
  if (!vars.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Sin productos.</div>';
    return;
  }
  vars.forEach(v => {
    const barColor = v.est==='crit'?'#E24B4A':v.est==='low'?'#EF9F27':'#639922';
    const pct = v.stock > 0 ? (v.min ? Math.min(100, Math.round(v.stock/(v.min*2)*100)) : 60) : 0;
    const stTxt = v.stock === null ? '—' : v.stock;
    const badgeCls = v.est==='crit'?'bcrit':v.est==='low'?'blow':'bok';
    const badgeLbl = v.est==='crit'?'Sin stock':v.est==='low'?'Bajo':'Normal';
    const qty = PEDIDO[v.vid] || 0;

    const row = document.createElement('div');
    row.className = 'pr';
    row.innerHTML = `
      <div class="pm">
        <div class="pname">${v.nombre}</div>
        ${v.sku ? `<div class="psku">${v.sku}</div>` : ''}
        <div class="pst">
          <span class="sn">${stTxt}</span>
          <span class="badge ${badgeCls}">${badgeLbl}</span>
          <span class="pb"><span class="pbf" style="width:${pct}%;background:${barColor}"></span></span>
        </div>
      </div>
      <div class="qc">
        <div class="qb minus" style="opacity:${qty>0?1:.3};pointer-events:${qty>0?'auto':'none'}">−</div>
        <div class="qn">${qty||''}</div>
        <div class="qb plus">+</div>
      </div>`;

    const vid = v.vid; // capturar vid en este scope
    const minusBtn = row.querySelector('.minus');
    const plusBtn  = row.querySelector('.plus');
    const qnEl     = row.querySelector('.qn');

    plusBtn.onclick = () => {
      PEDIDO[vid] = (PEDIDO[vid] || 0) + 1;
      qnEl.textContent = PEDIDO[vid];
      minusBtn.style.opacity = '1';
      minusBtn.style.pointerEvents = 'auto';
      updateBadge();
    };

    minusBtn.onclick = () => {
      if (!PEDIDO[vid] || PEDIDO[vid] <= 0) return;
      PEDIDO[vid]--;
      if (PEDIDO[vid] === 0) {
        delete PEDIDO[vid];
        qnEl.textContent = '';
        minusBtn.style.opacity = '.3';
        minusBtn.style.pointerEvents = 'none';
      } else {
        qnEl.textContent = PEDIDO[vid];
      }
      updateBadge();
    };

    el.appendChild(row);
  });
}

// Agregar sugeridos: productos con stock bajo/sin stock
function addAll() {
  const vars = varsByCat(CAT).filter(v => v.est !== 'ok');
  if (!vars.length) { alert('No hay productos con stock bajo o sin stock.'); return; }
  vars.forEach(v => {
    const sug = Math.max(1, (v.min || 5) * 2 - Math.max(v.stock || 0, 0));
    PEDIDO[v.vid] = sug;
  });
  updateBadge();
  renderProds(); // re-render para mostrar cantidades
}

// ══════════════════════════════════════════════════════════════════════
// RENDER PEDIDO
// Construye la vista desde PEDIDO (solo IDs) + ITEMS (datos)
// ══════════════════════════════════════════════════════════════════════
function renderPedido() {
  const el = document.getElementById('ped-sc');
  el.innerHTML = '';

  // Agrupar por categoría
  const byCat = {};
  Object.entries(PEDIDO).forEach(([vid, qty]) => {
    if (qty <= 0) return;
    const data = varById(vid);
    if (!data) return;
    const cid = data.catId || '__';
    if (!byCat[cid]) byCat[cid] = [];
    byCat[cid].push({ ...data, qty });
  });

  const cids = Object.keys(byCat);
  if (!cids.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-shopping-cart"></i>El pedido está vacío.<br>Entrá a un proveedor y tocá + en los productos.</div>';
    return;
  }

  cids.forEach(cid => {
    const items = byCat[cid];
    const total = items.reduce((s, i) => s + i.qty * (i.costo || 0), 0);

    const card = document.createElement('div');
    card.className = 'pc';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'ph';
    hdr.innerHTML = `<div class="phn"><i class="ti ti-tag" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>${catLabel(cid)}</div>`;
    const pb = document.createElement('button');
    pb.className = 'btns bg';
    pb.innerHTML = '<i class="ti ti-download"></i> PDF';
    pb.onclick = () => pdfCat(cid, items);
    hdr.appendChild(pb);
    card.appendChild(hdr);

    // Items
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'prow';
      row.innerHTML = `
        <div class="prn">${item.nombre}${item.sku ? '<br><span style="font-size:10px;color:var(--text3)">'+item.sku+'</span>' : ''}</div>
        <div class="prq">
          <div class="qb" style="width:28px;height:28px;font-size:17px">−</div>
          <div class="qn" style="min-width:22px;font-size:13px">${item.qty}</div>
          <div class="qb" style="width:28px;height:28px;font-size:17px">+</div>
          <div class="qb" style="width:28px;height:28px;font-size:13px;color:var(--red-text)"><i class="ti ti-trash"></i></div>
        </div>`;

      const qnEl  = row.querySelector('.qn');
      const btns  = row.querySelectorAll('.qb');
      const vid   = item.vid;

      btns[0].onclick = () => { // −
        if (!PEDIDO[vid]) return;
        PEDIDO[vid]--;
        if (PEDIDO[vid] <= 0) { delete PEDIDO[vid]; updateBadge(); renderPedido(); return; }
        qnEl.textContent = PEDIDO[vid];
        updateBadge();
      };
      btns[1].onclick = () => { // +
        PEDIDO[vid] = (PEDIDO[vid] || 0) + 1;
        qnEl.textContent = PEDIDO[vid];
        updateBadge();
      };
      btns[2].onclick = () => { // del
        delete PEDIDO[vid];
        updateBadge();
        renderPedido();
      };
      card.appendChild(row);
    });

    // Total
    const tot = document.createElement('div');
    tot.className = 'ptot';
    tot.innerHTML = `<span style="color:var(--text2)">Total estimado:</span><strong>${total ? '$'+total.toLocaleString('es-AR') : '—'}</strong>`;
    card.appendChild(tot);
    el.appendChild(card);
  });
}

// ══════════════════════════════════════════════════════════════════════
// PDF
// ══════════════════════════════════════════════════════════════════════
function pdfHdr(doc, title) {
  doc.setFillColor(24,95,165); doc.rect(0,0,210,26,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text(title,14,15);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),14,22);
  doc.setTextColor(40,40,40);
}
function pdfFtr(doc) {
  const n = doc.internal.getNumberOfPages();
  for (let i=1;i<=n;i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150);
    doc.line(14,287,196,287);
    doc.text('Pág. '+i+'/'+n,196,292,{align:'right'});
    doc.text('Stock & Pedidos',14,292);
  }
}
function buildTbl(doc, items, y) {
  const total = items.reduce((s,i) => s + i.qty*(i.costo||0), 0);
  doc.autoTable({
    head:[['Producto','SKU','Cant.','Precio','Subtotal']],
    body: items.map(i => [i.nombre, i.sku||'—', i.qty, i.costo?'$'+i.costo.toLocaleString('es-AR'):'—', i.costo?'$'+(i.qty*i.costo).toLocaleString('es-AR'):'—']),
    foot:[['','','','Total:', total?'$'+total.toLocaleString('es-AR'):'—']],
    startY:y, styles:{fontSize:9,cellPadding:4},
    headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold'},
    footStyles:{fillColor:[230,241,251],textColor:[12,68,124],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[248,248,246]},
    columnStyles:{2:{halign:'center'},3:{halign:'right'},4:{halign:'right'}},
  });
}

function pdfCat(cid, items) {
  if (!items?.length) { alert('Sin productos.'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  pdfHdr(doc, 'Pedido — ' + catLabel(cid));
  buildTbl(doc, items, 32);
  pdfFtr(doc);
  doc.save('pedido-'+catLabel(cid).replace(/\s+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.pdf');
}

function pdfAll() {
  // Reconstruir lista igual que renderPedido
  const byCat = {};
  Object.entries(PEDIDO).forEach(([vid, qty]) => {
    if (qty <= 0) return;
    const data = varById(vid);
    if (!data) return;
    const cid = data.catId || '__';
    if (!byCat[cid]) byCat[cid] = [];
    byCat[cid].push({ ...data, qty });
  });
  const cids = Object.keys(byCat);
  if (!cids.length) { alert('El pedido está vacío.'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  let first = true;
  cids.forEach(cid => {
    if (!first) doc.addPage();
    first = false;
    pdfHdr(doc, 'Pedido — ' + catLabel(cid));
    buildTbl(doc, byCat[cid], 32);
  });
  pdfFtr(doc);
  doc.save('pedidos-'+new Date().toISOString().slice(0,10)+'.pdf');
}
</script>
