<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Loyverse Stock</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9b9b97;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#f0efe9;--text2:#9b9b97;--text3:#6b6b68;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  --blue-bg:#0c2a4a;--blue-text:#85B7EB;
  --green-bg:#1a3308;--green-text:#97C459;
  --amber-bg:#2e1e04;--amber-text:#EF9F27;
  --red-bg:#2e0d0d;--red-text:#F09595;
}}
html,body{height:100%;background:var(--bg3)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}
.connect-scroll{flex:1;overflow-y:auto;padding:28px 20px;display:flex;flex-direction:column;gap:16px}
.connect-icon{width:56px;height:56px;background:var(--blue);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto}
.connect-title{font-size:18px;font-weight:600;text-align:center;color:var(--text)}
.connect-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6}
label.lbl{font-size:11px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input[type=password],input[type=search]{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none}
input:focus{border-color:var(--blue)}
.hint{font-size:12px;color:var(--text3);line-height:1.6}
.err-box{background:var(--red-bg);color:var(--red-text);font-size:12px;padding:10px 13px;border-radius:var(--r);display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;gap:8px}
.topbar-title{font-size:15px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;gap:7px;align-items:center;flex-shrink:0}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;font-size:10px;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:color .15s}
.nav-btn i{font-size:22px}
.nav-btn.active{color:var(--blue)}
.scroll-area{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.metric{background:var(--bg2);border-radius:var(--r);padding:11px 13px}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:3px}
.metric-value{font-size:22px;font-weight:600;color:var(--text)}
.search-wrap{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.search-wrap input{flex:1;min-width:120px}
select.sel{padding:10px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none}
.prod-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.stock-num{font-size:16px;font-weight:600}
.pbar{width:54px;height:4px;background:var(--bg3);border-radius:9px;overflow:hidden}
.pbar-fill{height:100%;border-radius:9px}
.badge{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:var(--green-bg);color:var(--green-text)}
.low{background:var(--amber-bg);color:var(--amber-text)}
.critical{background:var(--red-bg);color:var(--red-text)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;-webkit-tap-highlight-color:transparent;transition:opacity .1s;white-space:nowrap}
.btn:active{opacity:.65}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.pill{border-radius:99px;padding:6px 13px;font-size:12px}
.btn.icon{padding:7px;border-radius:var(--r)}
.btn.full{width:100%;justify-content:center;padding:12px}
.order-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:11px}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px;gap:8px}
.order-name{font-size:14px;font-weight:600}
.order-sub{font-size:11px;color:var(--text2);margin-top:2px}
.order-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.order-item:last-of-type{border-bottom:none}
.oi-name{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty-row{display:flex;align-items:center;gap:5px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent}
.qty-val{font-size:13px;font-weight:600;min-width:24px;text-align:center}
.order-total{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;gap:8px;align-items:center}
.cat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:9px}
.cat-name{font-size:14px;font-weight:600;margin-bottom:7px}
.cat-badges{display:flex;gap:6px;flex-wrap:wrap}
.count-pill{font-size:11px;background:var(--bg2);padding:3px 9px;border-radius:99px;color:var(--text2);font-weight:500}
.tab-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:var(--text);border-bottom-color:var(--blue)}
.store-sel{padding:7px 10px;border:1px solid var(--border2);border-radius:99px;font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;max-width:140px;-webkit-appearance:none;outline:none}
.empty{text-align:center;padding:36px 20px;color:var(--text2);font-size:13px;line-height:1.6}
.empty i{font-size:32px;display:block;margin:0 auto 10px;color:var(--text3)}
.loading-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:36px;color:var(--text2);font-size:13px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">

<!-- CONNECT -->
<div class="screen active" id="sc-connect">
  <div class="connect-scroll">
    <div class="connect-icon"><i class="ti ti-building-store"></i></div>
    <div class="connect-title">Loyverse Stock</div>
    <div class="connect-sub">Controlá tu stock y armá pedidos por categoría directamente desde tu celular.</div>
    <div>
      <label class="lbl">Token de acceso</label>
      <input type="password" id="token-input" placeholder="Pegá tu Bearer token aquí" />
    </div>
    <div class="err-box" id="conn-err"></div>
    <button class="btn primary full" onclick="conectar()">
      <i class="ti ti-plug"></i> Conectar con Loyverse
    </button>
    <div class="hint">
      Encontralo en <strong>Loyverse → Configuración → Integraciones → API de acceso</strong>.<br><br>
      El token solo se usa en este navegador y no se guarda en ningún servidor.
    </div>
  </div>
</div>

<!-- STOCK -->
<div class="screen" id="sc-stock">
  <div class="topbar">
    <span class="topbar-title">Stock</span>
    <div class="topbar-right">
      <select class="store-sel" id="store-sel" onchange="onStoreChange()"></select>
      <button class="btn icon" onclick="recargar()" title="Actualizar"><i class="ti ti-refresh"></i></button>
    </div>
  </div>
  <div class="scroll-area">
    <div class="metrics" id="metrics"></div>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Buscar producto o SKU…" oninput="renderStock()" />
      <select class="sel" id="filter-cat" onchange="renderStock()"><option value="">Categoría</option></select>
      <select class="sel" id="filter-est" onchange="renderStock()">
        <option value="">Estado</option>
        <option value="critical">Sin stock</option>
        <option value="low">Bajo</option>
        <option value="ok">Normal</option>
      </select>
    </div>
    <div id="stock-list"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-stock" onclick="goTab('stock')"><i class="ti ti-package"></i>Stock</button>
    <button class="nav-btn" id="nav-pedidos" onclick="goTab('pedidos')"><i class="ti ti-shopping-cart"></i>Pedidos</button>
    <button class="nav-btn" id="nav-cats" onclick="goTab('cats')"><i class="ti ti-tag"></i>Categorías</button>
    <button class="nav-btn" onclick="desconectar()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

<!-- PEDIDOS -->
<div class="screen" id="sc-pedidos">
  <div class="topbar">
    <span class="topbar-title">Pedidos</span>
    <div class="topbar-right">
      <button class="btn pill success" onclick="exportPDFTodos()"><i class="ti ti-download"></i> PDF</button>
    </div>
  </div>
  <div class="scroll-area">
    <div class="tab-row">
      <div class="tab active" id="tab-manual" onclick="switchOrderTab('manual')">Manual</div>
      <div class="tab" id="tab-sug" onclick="switchOrderTab('sug')">Sugeridos</div>
    </div>
    <div id="orders-manual"></div>
    <div id="orders-sug" style="display:none"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" id="nav2-stock" onclick="goTab('stock')"><i class="ti ti-package"></i>Stock</button>
    <button class="nav-btn active" id="nav2-pedidos" onclick="goTab('pedidos')"><i class="ti ti-shopping-cart"></i>Pedidos</button>
    <button class="nav-btn" id="nav2-cats" onclick="goTab('cats')"><i class="ti ti-tag"></i>Categorías</button>
    <button class="nav-btn" onclick="desconectar()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

<!-- CATEGORÍAS -->
<div class="screen" id="sc-cats">
  <div class="topbar"><span class="topbar-title">Categorías</span></div>
  <div class="scroll-area" id="cats-list"></div>
  <div class="bottom-nav">
    <button class="nav-btn" id="nav3-stock" onclick="goTab('stock')"><i class="ti ti-package"></i>Stock</button>
    <button class="nav-btn" id="nav3-pedidos" onclick="goTab('pedidos')"><i class="ti ti-shopping-cart"></i>Pedidos</button>
    <button class="nav-btn active" id="nav3-cats" onclick="goTab('cats')"><i class="ti ti-tag"></i>Categorías</button>
    <button class="nav-btn" onclick="desconectar()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

</div>
<script>
let TOKEN='',allItems=[],allInventory=[],allCategories=[],allStores=[],currentStore='',pedidoActual={};

// Proxy CORS para evitar bloqueos del navegador
const PROXY = 'https://corsproxy.io/?url=';
const LBASE = 'https://api.loyverse.com/v1.0';

async function loyFetch(path) {
  const target = encodeURIComponent(LBASE + path);
  const res = await fetch(PROXY + target, {
    method: 'GET',
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('HTTP ' + res.status + ': ' + txt.slice(0,120));
  }
  return res.json();
}

async function fetchAll(path, key, extra='') {
  let results=[], cursor=null;
  do {
    const sep = extra.includes('?') ? '&' : '?';
    const d = await loyFetch(path + extra + (cursor ? sep+'cursor='+cursor : ''));
    results = results.concat(d[key] || []);
    cursor = d.cursor || null;
  } while(cursor);
  return results;
}

function setStockContent(html) { document.getElementById('stock-list').innerHTML = html; }
function loadingHtml(msg) { return `<div class="loading-row"><div class="spinner"></div>${msg}</div>`; }

async function conectar() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  TOKEN = t;
  const err = document.getElementById('conn-err');
  err.style.display = 'none';
  setStockContent(loadingHtml('Conectando…'));
  try {
    await recargar(true);
  } catch(e) {
    TOKEN = '';
    err.textContent = 'Error: ' + e.message;
    err.style.display = 'block';
    setStockContent('');
  }
}

async function recargar(first) {
  if (!first) setStockContent(loadingHtml('Actualizando…'));

  setStockContent(loadingHtml('Cargando tiendas…'));
  const sd = await loyFetch('/stores');
  allStores = sd.stores || [];

  setStockContent(loadingHtml('Cargando categorías…'));
  allCategories = await fetchAll('/categories', 'categories');

  setStockContent(loadingHtml('Cargando productos…'));
  allItems = await fetchAll('/items', 'items');

  setStockContent(loadingHtml('Cargando inventario…'));
  allInventory = [];
  for (const s of allStores) {
    const inv = await fetchAll('/inventory', 'inventory_levels', '?store_id='+s.id);
    allInventory = allInventory.concat(inv);
  }

  if (first) {
    document.getElementById('sc-connect').classList.remove('active');
    document.getElementById('sc-stock').classList.add('active');
    populateStoreFilter();
    if (!currentStore && allStores.length) currentStore = allStores[0].id;
    document.getElementById('store-sel').value = currentStore;
  }
  renderAll();
}

function desconectar() {
  TOKEN=''; allItems=[]; allInventory=[]; allCategories=[]; allStores=[]; pedidoActual={}; currentStore='';
  ['sc-stock','sc-pedidos','sc-cats'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('sc-connect').classList.add('active');
  document.getElementById('token-input').value = '';
}

function populateStoreFilter() {
  document.getElementById('store-sel').innerHTML = allStores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}
function onStoreChange() { currentStore = document.getElementById('store-sel').value; renderAll(); }

function getStock(vId) {
  return allInventory.filter(i => i.variant_id===vId && i.store_id===currentStore).reduce((s,i) => s+(i.in_stock||0), 0);
}
function getEstado(stock, min) {
  if (stock <= 0) return 'critical';
  if (min > 0 && stock < min) return 'low';
  return 'ok';
}
const estadoLabel = e => ({ok:'Normal', low:'Bajo', critical:'Sin stock'}[e]);
function getCatName(id) {
  if (!id) return 'Sin categoría';
  return (allCategories.find(c => c.id===id) || {name:'Sin categoría'}).name;
}

function flatItems() {
  const rows = [];
  allItems.forEach(item => {
    (item.variants || []).forEach(v => {
      const stock = getStock(v.id);
      const min = v.low_stock || item.low_stock || 0;
      rows.push({
        variantId: v.id,
        nombre: item.item_name + (v.variant_name && v.variant_name!==item.item_name ? ' — '+v.variant_name : ''),
        categoryId: item.category_id || null,
        stock, min, costo: v.cost || 0,
        estado: getEstado(stock, min),
        sku: v.sku || ''
      });
    });
  });
  return rows;
}

function renderAll() { renderMetrics(); populateCatFilter(); renderStock(); renderCats(); }

function renderMetrics() {
  const rows = flatItems();
  const crit = rows.filter(r => r.estado==='critical').length;
  const low  = rows.filter(r => r.estado==='low').length;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Productos</div><div class="metric-value">${rows.length}</div></div>
    <div class="metric"><div class="metric-label">Categorías</div><div class="metric-value">${allCategories.length}</div></div>
    <div class="metric"><div class="metric-label">Sin stock</div><div class="metric-value" style="color:var(--red-text)">${crit}</div></div>
    <div class="metric"><div class="metric-label">Stock bajo</div><div class="metric-value" style="color:var(--amber-text)">${low}</div></div>`;
}

function populateCatFilter() {
  const sel = document.getElementById('filter-cat'); const cur = sel.value;
  sel.innerHTML = '<option value="">Categoría</option>' +
    allCategories.map(c => `<option value="${c.id}" ${cur===c.id?'selected':''}>${c.name}</option>`).join('');
}

function renderStock() {
  const search = (document.getElementById('search').value||'').toLowerCase();
  const fCat = document.getElementById('filter-cat').value;
  const fEst = document.getElementById('filter-est').value;
  const rows = flatItems().filter(r => {
    if (search && !r.nombre.toLowerCase().includes(search) && !r.sku.toLowerCase().includes(search)) return false;
    if (fCat && r.categoryId !== fCat) return false;
    if (fEst && r.estado !== fEst) return false;
    return true;
  });
  if (!rows.length) { setStockContent('<div class="empty"><i class="ti ti-package"></i>Sin resultados.</div>'); return; }
  setStockContent(rows.map(r => {
    const pct = Math.min(100, Math.round((r.stock/(r.min*2||Math.max(r.stock,1)))*100));
    const barColor = r.estado==='critical'?'#E24B4A':r.estado==='low'?'#EF9F27':'#639922';
    return `<div class="prod-card">
      <div class="prod-info">
        <div class="prod-name">${r.nombre}</div>
        <div class="prod-meta"><i class="ti ti-tag" style="font-size:11px;vertical-align:-1px"></i> ${getCatName(r.categoryId)}${r.sku?' · '+r.sku:''}</div>
        <div class="pbar" style="margin-top:6px"><div class="pbar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      </div>
      <div class="prod-right">
        <div class="stock-num">${r.stock}</div>
        <span class="badge ${r.estado}">${estadoLabel(r.estado)}</span>
        <button class="btn pill primary" onclick="agregarAlPedido('${r.variantId}')" style="font-size:11px;padding:5px 11px"><i class="ti ti-plus"></i> Pedir</button>
      </div>
    </div>`;
  }).join(''));
}

function agregarAlPedido(variantId) {
  const r = flatItems().find(x => x.variantId===variantId); if (!r) return;
  const cid = r.categoryId || '__sin_cat__';
  if (!pedidoActual[cid]) pedidoActual[cid] = {};
  if (!pedidoActual[cid][variantId]) pedidoActual[cid][variantId] = {row:r, qty:Math.max(1,r.min-r.stock)};
  else pedidoActual[cid][variantId].qty++;
  goTab('pedidos');
}

function switchOrderTab(tab) {
  document.getElementById('tab-manual').classList.toggle('active', tab==='manual');
  document.getElementById('tab-sug').classList.toggle('active', tab==='sug');
  document.getElementById('orders-manual').style.display = tab==='manual' ? 'block' : 'none';
  document.getElementById('orders-sug').style.display = tab==='sug' ? 'block' : 'none';
  tab==='sug' ? renderSugeridos() : renderOrders();
}

function renderOrders() {
  const container = document.getElementById('orders-manual');
  const cids = Object.keys(pedidoActual);
  if (!cids.length) { container.innerHTML='<div class="empty"><i class="ti ti-shopping-cart"></i>Sin productos.<br>Desde Stock tocá <strong>Pedir</strong>.</div>'; return; }
  container.innerHTML = cids.map(cid => {
    const catName = getCatName(cid==='__sin_cat__' ? null : cid);
    const items = Object.values(pedidoActual[cid]);
    const total = items.reduce((s,i) => s+i.qty*(i.row.costo||0), 0);
    const rows = items.map(({row:r, qty}) => `
      <div class="order-item">
        <div class="oi-name">${r.nombre}</div>
        <div class="qty-row">
          <div class="qty-btn" onclick="changeQty('${cid}','${r.variantId}',-1)">−</div>
          <div class="qty-val">${qty}</div>
          <div class="qty-btn" onclick="changeQty('${cid}','${r.variantId}',1)">+</div>
          <div class="qty-btn" onclick="removeItem('${cid}','${r.variantId}')" style="color:var(--red-text)"><i class="ti ti-trash"></i></div>
        </div>
      </div>`).join('');
    return `<div class="order-card">
      <div class="order-header">
        <div>
          <div class="order-name"><i class="ti ti-tag" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>${catName}</div>
          <div class="order-sub">${items.length} producto${items.length!==1?'s':''}</div>
        </div>
        <button class="btn pill success" onclick="exportPDFCat('${cid}')"><i class="ti ti-download"></i> PDF</button>
      </div>
      ${rows}
      <div class="order-total"><span style="color:var(--text2)">Total:</span><strong>${total?'$'+total.toLocaleString('es-AR'):'—'}</strong></div>
    </div>`;
  }).join('');
}

function renderSugeridos() {
  const bajos = flatItems().filter(r => r.estado!=='ok');
  const container = document.getElementById('orders-sug');
  if (!bajos.length) { container.innerHTML='<div class="empty"><i class="ti ti-circle-check"></i>¡Todo el stock está en nivel normal!</div>'; return; }
  const byCat = {};
  bajos.forEach(r => { const k=r.categoryId||'__sin_cat__'; if(!byCat[k]) byCat[k]=[]; byCat[k].push(r); });
  container.innerHTML = Object.entries(byCat).map(([cid,prods]) => {
    const catName = getCatName(cid==='__sin_cat__' ? null : cid);
    const rows = prods.map(r => {
      const sug = Math.max(1,(r.min||5)*2-r.stock);
      const sid = 'sug_'+r.variantId.replace(/[^a-z0-9]/gi,'_');
      return `<div class="order-item">
        <div style="flex:1;min-width:0">
          <div class="oi-name">${r.nombre}</div>
          <div style="display:flex;align-items:center;gap:7px;margin-top:3px">
            <span class="badge ${r.estado}">${estadoLabel(r.estado)}</span>
            <span style="font-size:11px;color:var(--text2)">actual: ${r.stock}${r.min?' / mín: '+r.min:''}</span>
          </div>
        </div>
        <div class="qty-row">
          <div class="qty-btn" onclick="changeSug('${sid}',-1)">−</div>
          <div class="qty-val" id="${sid}">${sug}</div>
          <div class="qty-btn" onclick="changeSug('${sid}',1)">+</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="order-card">
      <div class="order-header">
        <div class="order-name"><i class="ti ti-tag" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>${catName}</div>
        <button class="btn pill primary" onclick="importarSugeridos('${cid}')"><i class="ti ti-check"></i> Agregar</button>
      </div>${rows}</div>`;
  }).join('');
}

function changeSug(id,delta){ const el=document.getElementById(id); if(el) el.textContent=Math.max(1,parseInt(el.textContent)+delta); }

function importarSugeridos(cid) {
  const bajos = flatItems().filter(r => r.estado!=='ok' && (r.categoryId||'__sin_cat__')===cid);
  if (!pedidoActual[cid]) pedidoActual[cid] = {};
  bajos.forEach(r => {
    const el = document.getElementById('sug_'+r.variantId.replace(/[^a-z0-9]/gi,'_'));
    pedidoActual[cid][r.variantId] = {row:r, qty:el?Math.max(1,parseInt(el.textContent)||1):1};
  });
  switchOrderTab('manual');
}

function changeQty(cid,variantId,delta) {
  if (pedidoActual[cid]?.[variantId]) { pedidoActual[cid][variantId].qty=Math.max(1,pedidoActual[cid][variantId].qty+delta); renderOrders(); }
}
function removeItem(cid,variantId) {
  if (pedidoActual[cid]) { delete pedidoActual[cid][variantId]; if(!Object.keys(pedidoActual[cid]).length) delete pedidoActual[cid]; }
  renderOrders();
}

function renderCats() {
  const el = document.getElementById('cats-list');
  if (!allCategories.length) { el.innerHTML='<div class="empty"><i class="ti ti-tag"></i>Sin categorías.</div>'; return; }
  el.innerHTML = allCategories.map(c => {
    const prods = flatItems().filter(r => r.categoryId===c.id);
    const crit = prods.filter(r => r.estado==='critical').length;
    const low  = prods.filter(r => r.estado==='low').length;
    return `<div class="cat-card">
      <div class="cat-name">${c.name}</div>
      <div class="cat-badges">
        <span class="count-pill">${prods.length} producto${prods.length!==1?'s':''}</span>
        ${crit?`<span class="badge critical">${crit} sin stock</span>`:''}
        ${low?`<span class="badge low">${low} bajo</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function goTab(tab) {
  ['stock','pedidos','cats'].forEach(t => {
    document.getElementById('sc-'+t).classList.toggle('active', t===tab);
    ['nav-','nav2-','nav3-'].forEach(p => { const el=document.getElementById(p+t); if(el) el.classList.toggle('active',t===tab); });
  });
  if (tab==='pedidos') renderOrders();
  if (tab==='cats') renderCats();
}

function pdfHeader(doc,title) {
  doc.setFillColor(24,95,165); doc.rect(0,0,210,24,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.text(title,14,14);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),14,20);
  doc.setTextColor(40,40,40);
}
function pdfFooter(doc) {
  const n = doc.internal.getNumberOfPages();
  for (let i=1;i<=n;i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(160);
    doc.line(14,286,196,286);
    doc.text('Página '+i+' de '+n,196,291,{align:'right'});
    doc.text('Loyverse Stock Manager',14,291);
  }
}
function buildTable(doc,items,startY) {
  const total = items.reduce((s,i)=>s+i.qty*(i.row.costo||0),0);
  doc.autoTable({
    head:[['Producto','SKU','Cant.','Precio unit.','Subtotal']],
    body:items.map(({row:r,qty})=>[r.nombre,r.sku||'—',qty,r.costo?'$'+r.costo.toLocaleString('es-AR'):'—',r.costo?'$'+(qty*r.costo).toLocaleString('es-AR'):'—']),
    foot:[['','','','Total:',total?'$'+total.toLocaleString('es-AR'):'—']],
    startY, styles:{fontSize:9,cellPadding:4},
    headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold'},
    footStyles:{fillColor:[230,241,251],textColor:[12,68,124],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[248,248,246]},
    columnStyles:{2:{halign:'center'},3:{halign:'right'},4:{halign:'right'}}
  });
}
function exportPDFCat(cid) {
  const catName = getCatName(cid==='__sin_cat__'?null:cid);
  const items = Object.values(pedidoActual[cid]||{});
  if (!items.length) { alert('El pedido está vacío.'); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  pdfHeader(doc,'Pedido — '+catName);
  buildTable(doc,items,30);
  pdfFooter(doc);
  doc.save('pedido-'+catName.replace(/\s+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.pdf');
}
function exportPDFTodos() {
  const cids = Object.keys(pedidoActual);
  if (!cids.length) { alert('No hay pedidos armados todavía.'); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); let first=true;
  cids.forEach(cid => {
    if (!first) doc.addPage(); first=false;
    pdfHeader(doc,'Pedido — '+getCatName(cid==='__sin_cat__'?null:cid));
    buildTable(doc,Object.values(pedidoActual[cid]||{}),30);
  });
  pdfFooter(doc);
  doc.save('todos-pedidos-'+new Date().toISOString().slice(0,10)+'.pdf');
}
</script>
</body>
</html>
