<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Stock & Pedidos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9b9b97;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.20);
  --blue:#185FA5;--green:#3B6D11;
  --green-bg:#EAF3DE;--green-text:#27500A;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red-bg:#FCEBEB;--red-text:#A32D2D;
  --r:10px;--rl:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#f0efe9;--text2:#9b9b97;--text3:#6b6b68;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --green-bg:#1a3308;--green-text:#97C459;
  --amber-bg:#2e1e04;--amber-text:#EF9F27;
  --red-bg:#2e0d0d;--red-text:#F09595;
}}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px;overflow:hidden}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.screen.s-left{transform:translateX(-100%)}
.screen.s-right{transform:translateX(100%)}
.screen.s-show{transform:translateX(0)}

/* topbar */
.topbar{display:flex;align-items:center;padding:0 8px;height:52px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;gap:4px}
.topbar-title{font-size:16px;font-weight:600;flex:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:none;background:none;cursor:pointer;color:var(--text);font-size:22px;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.icon-btn:active{background:var(--bg2)}

/* bottom nav */
.bnav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:10px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;position:relative}
.nb i{font-size:22px}
.nb.on{color:var(--blue)}
.cc{position:absolute;top:3px;right:2px;min-width:16px;height:16px;background:var(--blue);color:#fff;border-radius:99px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px}

/* scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:12px 14px}

/* connect */
.cwrap{flex:1;overflow-y:auto;padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.clogo{width:60px;height:60px;background:var(--blue);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:0 auto}
.ctitle{font-size:20px;font-weight:700;text-align:center}
.csub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6}
.flbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none}
input[type=password]:focus{border-color:var(--blue)}
.hint{font-size:12px;color:var(--text3);line-height:1.6;text-align:center}
.errbox{background:var(--red-bg);color:var(--red-text);font-size:12px;padding:10px 13px;border-radius:var(--r);display:none}
.logbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:11px;font-family:monospace;max-height:160px;overflow-y:auto;display:none;color:var(--text2);line-height:1.7;word-break:break-all}
.logbox .ok{color:var(--green-text)}.logbox .er{color:var(--red-text)}.logbox .in{color:#185FA5}

/* buttons */
.btnp{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btnp:disabled{opacity:.5}
.btnsm{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btnsm:active{opacity:.75}
.btn-g{background:var(--green);color:#fff}

/* badges */
.badge{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bok{background:var(--green-bg);color:var(--green-text)}
.blow{background:var(--amber-bg);color:var(--amber-text)}
.bcrit{background:var(--red-bg);color:var(--red-text)}

/* category list */
.catrow{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;gap:12px}
.catrow:active{background:var(--bg2)}
.caticon{width:40px;height:40px;border-radius:var(--r);background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.catinfo{flex:1;min-width:0}
.catname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catsub{font-size:12px;color:var(--text2);margin-top:2px}
.catalerts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* product rows */
.prodrow{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.prodmain{flex:1;min-width:0}
.prodname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prodsku{font-size:11px;color:var(--text3);margin-top:1px}
.prodstock{display:flex;align-items:center;gap:8px;margin-top:5px}
.snum{font-size:14px;font-weight:700}
.pbar{width:48px;height:3px;background:var(--bg3);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbarfill{height:100%;border-radius:9px;display:block}

/* qty control */
.qctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qb{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;flex-shrink:0;transition:opacity .1s}
.qb:active{background:var(--bg3)}
.qb.plus{background:var(--blue);color:#fff;border-color:var(--blue)}
.qnum{min-width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--text)}

/* pedido */
.pedcat{margin-bottom:14px;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.pedhdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg2);gap:8px}
.pedname{font-size:14px;font-weight:600}
.pedrow{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--border);gap:10px}
.pedrname{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedqty{display:flex;align-items:center;gap:5px;flex-shrink:0}
.pedtot{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;gap:6px;background:var(--bg2)}

/* misc */
.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:13px;line-height:1.7}
.empty i{font-size:36px;display:block;margin:0 auto 12px;color:var(--text3)}
.ldg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--text2);font-size:13px}
.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.store-sel{padding:6px 10px;border:1px solid var(--border2);border-radius:99px;font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;-webkit-appearance:none;outline:none;max-width:120px}
</style>
</head>
<body>
<div class="app">

<!-- CONNECT -->
<div class="screen s-show" id="sc-con" style="position:relative;transform:none">
  <div class="cwrap">
    <div class="clogo"><i class="ti ti-building-store"></i></div>
    <div class="ctitle">Stock & Pedidos</div>
    <div class="csub">Conectate a Loyverse para ver stock por proveedor y armar pedidos.</div>
    <div><div class="flbl">Token de acceso</div>
      <input type="password" id="tok" placeholder="Pegá tu Bearer token…"/>
    </div>
    <button class="btnp" id="btncon" onclick="conectar()"><i class="ti ti-plug"></i> Conectar</button>
    <div class="logbox" id="logbox"></div>
    <div class="errbox" id="errbox"></div>
    <div class="hint">Loyverse → Configuración → Integraciones → API de acceso</div>
  </div>
</div>

<!-- PROVEEDORES -->
<div class="screen s-right" id="sc-cats">
  <div class="topbar">
    <span class="topbar-title">Proveedores</span>
    <select class="store-sel" id="store-sel" onchange="onStoreChange()"></select>
    <button class="icon-btn" onclick="recargar()"><i class="ti ti-refresh"></i></button>
  </div>
  <div class="scroll" id="cats-list"></div>
  <div class="bnav">
    <button class="nb on" id="nb-cats" onclick="showCats()"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb" id="nb-ped" onclick="showPedido()">
      <i class="ti ti-shopping-cart"></i>Pedido
      <span class="cc" id="cc1"></span>
    </button>
    <button class="nb" onclick="desconectar()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="screen s-right" id="sc-prods">
  <div class="topbar">
    <button class="icon-btn" onclick="closeProd()"><i class="ti ti-arrow-left"></i></button>
    <span class="topbar-title" id="prod-title">Productos</span>
    <button class="icon-btn" onclick="addSugeridos()" title="Agregar sugeridos"><i class="ti ti-sparkles"></i></button>
  </div>
  <div class="scroll" id="prods-list"></div>
</div>

<!-- PEDIDO -->
<div class="screen s-right" id="sc-ped">
  <div class="topbar">
    <span class="topbar-title">Pedido</span>
    <button class="icon-btn" onclick="exportTodos()"><i class="ti ti-download"></i></button>
  </div>
  <div class="scroll pad" id="ped-list"></div>
  <div class="bnav">
    <button class="nb" id="nb2-cats" onclick="showCats()"><i class="ti ti-building-store"></i>Proveedores</button>
    <button class="nb on" id="nb2-ped" onclick="showPedido()">
      <i class="ti ti-shopping-cart"></i>Pedido
      <span class="cc" id="cc2"></span>
    </button>
    <button class="nb" onclick="desconectar()"><i class="ti ti-logout"></i>Salir</button>
  </div>
</div>

</div><!-- /app -->
<script>
// ─────────────────────────────────────────────────────────────────────
// STATE — todo en un solo lugar, nunca duplicado
// ─────────────────────────────────────────────────────────────────────
const S = {
  token: '',
  items: [],       // [{id, item_name, category_id, variants:[{id,variant_name,cost,low_stock,sku}], low_stock}]
  inventory: [],   // [{variant_id, store_id, in_stock}]
  categories: [],  // [{id, name}]
  stores: [],      // [{id, name}]
  storeId: '',     // tienda activa
  catId: '',       // categoría abierta

  // pedido: Map<catId, Map<variantId, qty>>
  // Guardamos solo IDs + qty; los datos del producto los sacamos de S.items
  pedido: {},      // { catId: { variantId: qty } }
};

// ─────────────────────────────────────────────────────────────────────
// LOG
// ─────────────────────────────────────────────────────────────────────
const logEl = document.getElementById('logbox');
function log(msg, t='in') {
  logEl.style.display = 'block';
  const d = document.createElement('div');
  d.className = t;
  d.textContent = (t==='ok'?'✓ ':t==='er'?'✗ ':'→ ') + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML=''; logEl.style.display='none'; }

// ─────────────────────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const url = 'https://api.loyverse.com/v1.0' + path;
  const h = { 'Authorization': 'Bearer ' + S.token };
  try {
    const r = await fetch(url, { headers: h });
    if (r.ok) return r.json();
    throw new Error('HTTP ' + r.status);
  } catch(e) {
    const r2 = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { headers: h });
    if (!r2.ok) throw new Error('Error ' + r2.status);
    return r2.json();
  }
}

async function fetchAll(path, key, extra='') {
  let out=[], cursor=null;
  do {
    const sep = extra.includes('?') ? '&' : '?';
    const d = await apiFetch(path + extra + (cursor ? sep+'cursor='+cursor : ''));
    out = out.concat(d[key] || []);
    cursor = d.cursor || null;
  } while(cursor);
  return out;
}

// ─────────────────────────────────────────────────────────────────────
// CONNECT / LOAD
// ─────────────────────────────────────────────────────────────────────
async function conectar() {
  const t = document.getElementById('tok').value.trim();
  const btn = document.getElementById('btncon');
  const err = document.getElementById('errbox');
  if (!t) { err.textContent='Ingresá el token.'; err.style.display='block'; return; }
  S.token = t;
  err.style.display = 'none';
  clearLog();
  btn.disabled = true;
  btn.innerHTML = '<div class="spin" style="width:18px;height:18px;border-width:2px"></div> Conectando…';
  try {
    await loadAll();
    // Mostrar pantalla de categorías
    document.getElementById('sc-con').style.transform = 'translateX(-100%)';
    show('sc-cats');
  } catch(e) {
    S.token = '';
    log('ERROR: '+e.message, 'er');
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-plug"></i> Conectar';
  }
}

async function loadAll() {
  log('Tiendas…');
  const sd = await apiFetch('/stores');
  S.stores = sd.stores || [];
  log('Tiendas: ' + S.stores.map(s=>s.name).join(', '), 'ok');

  log('Categorías…');
  S.categories = await fetchAll('/categories', 'categories');
  log('Categorías: ' + S.categories.length, 'ok');

  log('Productos…');
  S.items = await fetchAll('/items', 'items');
  log('Productos: ' + S.items.length, 'ok');

  log('Inventario (puede tardar)…');
  S.inventory = await fetchAll('/inventory', 'inventory_levels');
  log('Inventario: ' + S.inventory.length + ' registros', 'ok');

  // Debug cross-check
  if (S.items.length && S.inventory.length) {
    const vid = S.items[0].variants?.[0]?.id;
    const m = S.inventory.find(i => i.variant_id === vid);
    log('Check variant→inv: ' + (m ? 'OK store_id='+m.store_id+' in_stock='+m.in_stock : 'NO MATCH'), m?'ok':'er');
  }

  // Store por defecto
  const sel = document.getElementById('store-sel');
  sel.innerHTML = S.stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  if (!S.storeId && S.stores.length) S.storeId = S.stores[0].id;
  sel.value = S.storeId;
}

async function recargar() {
  document.getElementById('cats-list').innerHTML = '<div class="ldg"><div class="spin"></div>Actualizando…</div>';
  try { await loadAll(); renderCats(); }
  catch(e) { document.getElementById('cats-list').innerHTML = '<div class="empty"><i class="ti ti-alert-circle"></i>'+e.message+'</div>'; }
}

function onStoreChange() {
  S.storeId = document.getElementById('store-sel').value;
  renderCats();
}

function desconectar() {
  Object.assign(S, { token:'', items:[], inventory:[], categories:[], stores:[], storeId:'', catId:'', pedido:{} });
  clearLog();
  document.getElementById('tok').value = '';
  document.getElementById('errbox').style.display = 'none';
  ['sc-cats','sc-prods','sc-ped'].forEach(id => {
    document.getElementById(id).className = 'screen s-right';
  });
  document.getElementById('sc-con').style.transform = '';
  updateBadge();
}

// ─────────────────────────────────────────────────────────────────────
// HELPERS — stock y datos
// ─────────────────────────────────────────────────────────────────────
function getStock(variantId) {
  const all = S.inventory.filter(i => i.variant_id === variantId);
  if (!all.length) return null;
  const byStore = all.filter(i => i.store_id === S.storeId);
  const src = byStore.length ? byStore : all;
  return src.reduce((s, i) => s + (parseFloat(i.in_stock) || 0), 0);
}

function estado(stock, min) {
  if (stock === null) return 'ok';
  if (stock <= 0) return 'crit';
  if (min > 0 && stock < min) return 'low';
  return 'ok';
}
const eLabel = e => ({ ok:'Normal', low:'Bajo', crit:'Sin stock' }[e]);
const eBadge = e => ({ ok:'bok', low:'blow', crit:'bcrit' }[e]);

function catName(id) {
  return (S.categories.find(c => c.id === id) || { name:'Sin categoría' }).name;
}

// Devuelve lista plana de variantes para una categoría
// IMPORTANTE: no guarda referencias mutables, solo datos primitivos
function variantsByCat(catId) {
  const out = [];
  S.items
    .filter(item => item.category_id === catId)
    .forEach(item => {
      (item.variants || []).forEach(v => {
        const stock = getStock(v.id);
        const min = v.low_stock || item.low_stock || 0;
        out.push({
          vid:    v.id,
          nombre: item.item_name + (v.variant_name && v.variant_name !== item.item_name ? ' — '+v.variant_name : ''),
          sku:    v.sku || '',
          costo:  v.cost || 0,
          stock,
          min,
          est:    estado(stock, min),
        });
      });
    });
  return out;
}

// Lee la cantidad del pedido — SIEMPRE desde S.pedido, nunca desde closures
function getQty(catId, variantId) {
  return S.pedido[catId]?.[variantId] ?? 0;
}

function setQty(catId, variantId, qty) {
  if (!S.pedido[catId]) S.pedido[catId] = {};
  if (qty <= 0) {
    delete S.pedido[catId][variantId];
    if (!Object.keys(S.pedido[catId]).length) delete S.pedido[catId];
  } else {
    S.pedido[catId][variantId] = qty;
  }
  updateBadge();
}

function totalItems() {
  let t = 0;
  Object.values(S.pedido).forEach(cat => Object.values(cat).forEach(q => t += q));
  return t;
}

function updateBadge() {
  const t = totalItems();
  ['cc1','cc2'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = t;
    el.style.display = t > 0 ? 'flex' : 'none';
  });
}

// ─────────────────────────────────────────────────────────────────────
// SCREEN NAVIGATION
// ─────────────────────────────────────────────────────────────────────
function show(id) {
  document.getElementById(id).className = 'screen s-show';
}
function hide(id, dir='s-right') {
  document.getElementById(id).className = 'screen ' + dir;
}

function showCats() {
  hide('sc-prods');
  hide('sc-ped');
  show('sc-cats');
  setNavActive('cats');
  renderCats();
}

function showPedido() {
  hide('sc-prods');
  hide('sc-cats', 's-left');
  show('sc-ped');
  setNavActive('ped');
  renderPedido();
}

function openCat(catId) {
  S.catId = catId;
  document.getElementById('prod-title').textContent = catName(catId);
  hide('sc-cats', 's-left');
  show('sc-prods');
  renderProds();
}

function closeProd() {
  hide('sc-prods');
  show('sc-cats');
  setNavActive('cats');
  renderCats(); // refrescar badges de "en pedido"
}

function setNavActive(tab) {
  ['nb-cats','nb-ped'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = 'nb' + (id.includes(tab) ? ' on' : '');
  });
  ['nb2-cats','nb2-ped'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = 'nb' + (id.includes(tab) ? ' on' : '');
  });
}

// ─────────────────────────────────────────────────────────────────────
// RENDER CATS
// ─────────────────────────────────────────────────────────────────────
function renderCats() {
  const el = document.getElementById('cats-list');
  if (!S.categories.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-building-store"></i>Sin categorías.</div>';
    return;
  }
  el.innerHTML = '';
  const sorted = [...S.categories].sort((a,b) => a.name.localeCompare(b.name));
  let shown = 0;
  sorted.forEach(cat => {
    const vars = variantsByCat(cat.id);
    if (!vars.length) return;
    shown++;
    const crit = vars.filter(v => v.est === 'crit').length;
    const low  = vars.filter(v => v.est === 'low').length;
    const inPed = Object.values(S.pedido[cat.id] || {}).reduce((s,q) => s+q, 0);

    const div = document.createElement('div');
    div.className = 'catrow';
    div.innerHTML = `
      <div class="caticon"><i class="ti ti-tag"></i></div>
      <div class="catinfo">
        <div class="catname">${cat.name}</div>
        <div class="catsub">${vars.length} producto${vars.length!==1?'s':''}</div>
        <div class="catalerts">
          ${crit ? `<span class="badge bcrit">${crit} sin stock</span>` : ''}
          ${low  ? `<span class="badge blow">${low} bajo</span>` : ''}
          ${inPed? `<span class="badge bok">${inPed} en pedido</span>` : ''}
        </div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px;flex-shrink:0"></i>`;
    // Solo un listener, sin closures con estado mutable
    div.addEventListener('click', () => openCat(cat.id));
    el.appendChild(div);
  });
  if (!shown) {
    el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Las categorías no tienen productos asociados.<br>Verificá que los productos tengan categoría en Loyverse.</div>';
  }
}

// ─────────────────────────────────────────────────────────────────────
// RENDER PRODS — usa S.catId, lee qty desde S.pedido cada vez
// ─────────────────────────────────────────────────────────────────────
function renderProds() {
  const el = document.getElementById('prods-list');
  const vars = variantsByCat(S.catId);
  if (!vars.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-package"></i>Sin productos en esta categoría.</div>';
    return;
  }
  el.innerHTML = '';
  vars.forEach(v => {
    const barColor = v.est==='crit'?'#E24B4A':v.est==='low'?'#EF9F27':'#639922';
    const pct = v.stock > 0 ? (v.min ? Math.min(100, Math.round(v.stock/(v.min*2)*100)) : 60) : 0;
    const stockTxt = v.stock === null ? '—' : v.stock;

    const row = document.createElement('div');
    row.className = 'prodrow';
    row.dataset.vid = v.vid; // guardar vid en el DOM para actualizarlo

    row.innerHTML = `
      <div class="prodmain">
        <div class="prodname">${v.nombre}</div>
        ${v.sku ? `<div class="prodsku">${v.sku}</div>` : ''}
        <div class="prodstock">
          <span class="snum">${stockTxt}</span>
          <span class="badge ${eBadge(v.est)}">${eLabel(v.est)}</span>
          <span class="pbar"><span class="pbarfill" style="width:${pct}%;background:${barColor}"></span></span>
        </div>
      </div>
      <div class="qctrl">
        <div class="qb minus">−</div>
        <div class="qnum"></div>
        <div class="qb plus">+</div>
      </div>`;

    // Función local que refresca el display leyendo SIEMPRE desde S.pedido
    function refresh() {
      const q = getQty(S.catId, v.vid);
      row.querySelector('.qnum').textContent = q || '';
      const m = row.querySelector('.minus');
      m.style.opacity = q > 0 ? '1' : '.3';
      m.style.pointerEvents = q > 0 ? 'auto' : 'none';
    }
    refresh();

    row.querySelector('.plus').addEventListener('click', () => {
      setQty(S.catId, v.vid, getQty(S.catId, v.vid) + 1);
      refresh();
    });
    row.querySelector('.minus').addEventListener('click', () => {
      const q = getQty(S.catId, v.vid);
      if (q <= 0) return;
      setQty(S.catId, v.vid, q - 1);
      refresh();
    });

    el.appendChild(row);
  });
}

function addSugeridos() {
  const vars = variantsByCat(S.catId).filter(v => v.est !== 'ok');
  if (!vars.length) { alert('No hay productos con stock bajo o sin stock.'); return; }
  vars.forEach(v => {
    const sug = Math.max(1, (v.min || 5) * 2 - Math.max(v.stock || 0, 0));
    setQty(S.catId, v.vid, sug);
  });
  renderProds(); // re-renderizar para mostrar cantidades actualizadas
}

// ─────────────────────────────────────────────────────────────────────
// RENDER PEDIDO — reconstruye datos desde S.items usando los IDs guardados
// ─────────────────────────────────────────────────────────────────────
function getVariantData(variantId) {
  // Buscar en S.items el item y variante correspondiente
  for (const item of S.items) {
    const v = (item.variants || []).find(v => v.id === variantId);
    if (v) {
      return {
        vid:    v.id,
        nombre: item.item_name + (v.variant_name && v.variant_name !== item.item_name ? ' — '+v.variant_name : ''),
        sku:    v.sku || '',
        costo:  v.cost || 0,
      };
    }
  }
  return null;
}

function renderPedido() {
  const el = document.getElementById('ped-list');
  const catIds = Object.keys(S.pedido).filter(cid => Object.keys(S.pedido[cid]).length > 0);

  if (!catIds.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-shopping-cart"></i>El pedido está vacío.<br>Entrá a un proveedor y tocá + en los productos.</div>';
    return;
  }

  el.innerHTML = '';
  catIds.forEach(cid => {
    const varIds = Object.keys(S.pedido[cid]);
    if (!varIds.length) return;

    // Reconstruir items desde S.items (fuente de verdad)
    const items = varIds.map(vid => {
      const data = getVariantData(vid);
      const qty  = S.pedido[cid][vid];
      return data ? { ...data, qty } : null;
    }).filter(Boolean);

    if (!items.length) return;

    const total = items.reduce((s, i) => s + i.qty * (i.costo || 0), 0);
    const card = document.createElement('div');
    card.className = 'pedcat';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'pedhdr';
    hdr.innerHTML = `<div class="pedname"><i class="ti ti-tag" style="font-size:13px;vertical-align:-1px;margin-right:5px"></i>${catName(cid)}</div>`;
    const pb = document.createElement('button');
    pb.className = 'btnsm btn-g';
    pb.innerHTML = '<i class="ti ti-download"></i> PDF';
    pb.addEventListener('click', () => exportCat(cid));
    hdr.appendChild(pb);
    card.appendChild(hdr);

    // Rows
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'pedrow';
      row.innerHTML = `
        <div class="pedrname">${item.nombre}${item.sku ? '<br><span style="font-size:10px;color:var(--text3)">'+item.sku+'</span>' : ''}</div>
        <div class="pedqty">
          <div class="qb" style="width:28px;height:28px;font-size:17px" data-dec>−</div>
          <div class="qnum" style="min-width:22px;font-size:13px">${item.qty}</div>
          <div class="qb" style="width:28px;height:28px;font-size:17px" data-inc>+</div>
          <div class="qb" style="width:28px;height:28px;font-size:13px;color:var(--red-text)" data-del><i class="ti ti-trash"></i></div>
        </div>`;
      row.querySelector('[data-dec]').addEventListener('click', () => {
        setQty(cid, item.vid, (S.pedido[cid]?.[item.vid] ?? 0) - 1);
        renderPedido();
      });
      row.querySelector('[data-inc]').addEventListener('click', () => {
        setQty(cid, item.vid, (S.pedido[cid]?.[item.vid] ?? 0) + 1);
        renderPedido();
      });
      row.querySelector('[data-del]').addEventListener('click', () => {
        setQty(cid, item.vid, 0);
        renderPedido();
      });
      card.appendChild(row);
    });

    // Total
    const tot = document.createElement('div');
    tot.className = 'pedtot';
    tot.innerHTML = `<span style="color:var(--text2)">Total estimado:</span><strong>${total ? '$'+total.toLocaleString('es-AR') : '—'}</strong>`;
    card.appendChild(tot);
    el.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────
// PDF
// ─────────────────────────────────────────────────────────────────────
function pdfHdr(doc, title) {
  doc.setFillColor(24,95,165); doc.rect(0,0,210,26,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.text(title,14,15);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),14,22);
  doc.setTextColor(40,40,40);
}
function pdfFtr(doc) {
  const n = doc.internal.getNumberOfPages();
  for (let i=1;i<=n;i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150);
    doc.line(14,287,196,287);
    doc.text('Pág. '+i+'/'+n, 196,292, {align:'right'});
    doc.text('Stock & Pedidos', 14,292);
  }
}
function buildTable(doc, items, y) {
  const total = items.reduce((s,i) => s + i.qty*(i.costo||0), 0);
  doc.autoTable({
    head:[['Producto','SKU','Cant.','Precio unit.','Subtotal']],
    body: items.map(i => [
      i.nombre, i.sku||'—', i.qty,
      i.costo ? '$'+i.costo.toLocaleString('es-AR') : '—',
      i.costo ? '$'+(i.qty*i.costo).toLocaleString('es-AR') : '—',
    ]),
    foot:[['','','','Total:', total ? '$'+total.toLocaleString('es-AR') : '—']],
    startY: y,
    styles:{fontSize:9,cellPadding:4},
    headStyles:{fillColor:[24,95,165],textColor:255,fontStyle:'bold'},
    footStyles:{fillColor:[230,241,251],textColor:[12,68,124],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[248,248,246]},
    columnStyles:{2:{halign:'center'},3:{halign:'right'},4:{halign:'right'}},
  });
}

function exportCat(cid) {
  const varIds = Object.keys(S.pedido[cid] || {});
  const items = varIds.map(vid => {
    const data = getVariantData(vid);
    return data ? { ...data, qty: S.pedido[cid][vid] } : null;
  }).filter(Boolean);
  if (!items.length) { alert('Sin productos.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHdr(doc, 'Pedido — ' + catName(cid));
  buildTable(doc, items, 32);
  pdfFtr(doc);
  doc.save('pedido-'+catName(cid).replace(/\s+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.pdf');
}

function exportTodos() {
  const cids = Object.keys(S.pedido).filter(c => Object.keys(S.pedido[c]).length);
  if (!cids.length) { alert('El pedido está vacío.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let first = true;
  cids.forEach(cid => {
    const varIds = Object.keys(S.pedido[cid]);
    const items = varIds.map(vid => {
      const data = getVariantData(vid);
      return data ? { ...data, qty: S.pedido[cid][vid] } : null;
    }).filter(Boolean);
    if (!items.length) return;
    if (!first) doc.addPage();
    first = false;
    pdfHdr(doc, 'Pedido — ' + catName(cid));
    buildTable(doc, items, 32);
  });
  pdfFtr(doc);
  doc.save('pedidos-'+new Date().toISOString().slice(0,10)+'.pdf');
}
</script>
